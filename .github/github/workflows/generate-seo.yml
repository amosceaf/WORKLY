name: Générer les pages SEO
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/generate-seo.mjs
        env:
          SITE_URL: https://TON-SITE
      - name: Enregistrer les changements
        run: |
          git config user.name "workly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add offres sitemap.xml
          git diff --staged --quiet || (git commit -m "Mise à jour SEO" && git push)
