
name: Générer les pages SEO

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer WORKLY
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Générer les pages SEO
        run: node tools/generate-seo.mjs
        env:
          SITE_URL: https://amosceaf.github.io/WORKLY
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Enregistrer les changements
        run: |
          git config user.name "workly-bot"
          git config user.email "bot@users.noreply.github.com"
          git add offres sitemap.xml
          git diff --cached --quiet || (git commit -m "Mise à jour SEO" && git push)
