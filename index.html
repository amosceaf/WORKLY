px">Messages ce mois-ci : ${quotaTxt("chat")}</p><div class="row" style="align-items:center"><label style="display:flex;gap:8px;color:var(--text);font-size:15px;font-weight:400;margin:0"><input type="checkbox" data-a="chatvoice" ${voiceOn()?"checked":""}> 🎙️ Mode vocal (envoi après dictée, réponses lues)</label><span><button class="lnk" data-a="chatstop">⏹ Voix</button><button class="lnk" data-a="chatnew">Nouvelle conversation</button></span></div><div id="chatlog" style="max-height:420px;overflow-y:auto;margin:10px 0"></div>${CHAT.length?"":`<div class="chips" style="margin-bottom:10px">${sug.map((s,i)=>`<button class="chip" style="cursor:pointer" data-a="chatsug" data-id="${i}">${esc(s)}</button>`).join("")}</div>`}<div style="display:flex;gap:8px;align-items:flex-end"><textarea id="ci" rows="2" style="min-height:48px" placeholder="Écris ou dicte ton message…"></textarea><div style="display:flex;flex-direction:column;gap:6px">${SRC?`<button class="ghost" id="micb" data-a="chatmic" title="Dicter">🎤</button>`:""}<button data-a="chatsend">Envoyer</button></div></div><p class="meta" style="margin:8px 0 0">${SRC?"La dictée utilise la reconnaissance vocale de ton navigateur.":"La dictée vocale n’est pas disponible sur ce navigateur (essaie Chrome)."} Ne partage pas d’informations sensibles.</p></div>`} function chatRender(){const el=$("#chatlog");if(!el)return;  const intro=!CHAT.length?`<div style="margin:6px 0"><div style="max-width:85%;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)">Bonjour ! Je suis Evolia. ${role()==="entreprise"?"Je peux t’aider à recruter : rédiger une offre, présélectionner, préparer tes entretiens.":"Je peux t’aider à trouver un emploi : CV, entretiens, compétences, orientation."} Pose-moi ta question, à l’écrit ou à la voix.</div></div>`:"";  el.innerHTML=intro+CHAT.map((m,i)=>`<div style="display:flex;justify-content:${m.r==="user"?"flex-end":"flex-start"};margin:6px 0"><div style="max-width:85%;padding: lateforme contre les fausses offres et les abus.\nNous n’utilisons pas tes données pour de la publicité et nous ne les vendons pas."], ["4. Qui peut voir tes données","- Une entreprise voit ton profil et ton CV lorsque tu as postulé à l’une de ses offres. Les autres utilisateurs ne voient pas ton profil. Si tu l’as autorisé dans ton compte (désactivé par défaut) et selon son abonnement, l’entreprise peut conserver une copie de ton profil dans son vivier de talents pour de futurs recrutements ; tu peux retirer cette autorisation et demander la suppression de la copie en écrivant à Workly225@gmail.com.\n- Tes messages ne sont visibles que par toi et par l’autre personne de la conversation.\n- Nos prestataires techniques traitent les données pour notre compte : l’hébergement de la base de données et des comptes (Supabase), l’hébergement du site (GitHub Pages), le prestataire de paiement et, le service d’intelligence artificielle qui alimente Evolia (Groq), uniquement si tu l’as autorisé dans ton compte. Les textes que tu envoies à Evolia sont transmis à ce service pour produire la réponse, après suppression de ton nom, de ton adresse e-mail et de ton numéro de téléphone ; selon ses conditions, ce prestataire n’utilise pas ces textes pour entraîner ses modèles.\n- La dictée vocale d’Evolia utilise la reconnaissance vocale intégrée à ton navigateur : selon le navigateur, l’audio est traité par son éditeur (par exemple Google pour Chrome)."], ["5. Hébergement et transferts","Ces prestataires peuvent héberger les données en dehors de la Côte d’Ivoire. Nous choisissons des prestataires qui appliquent des mesures de sécurité reconnues."], ["6. Durée de conservation","Nous conservons tes données tant que ton compte est actif. Sur demande par e-mail, nous supprimons ton compte et tes données dans un délai de 30 jours, sauf celles que la loi nous oblige à garder (par exemple les justificatifs de paiement)."], ["7. Tes droits",`Tu peux demander à tout moment l’accès à tes données, leur correction, leur suppression, ou t’opposer à certains usages. Écris à ${B.mail} depuis l’adresse de ton compte. Tu peux aussi télécharger tes données depuis ton compte. Nous répondons sous 30 jours.`], ["8. Sécurité","Les mots de passe sont chiffrés et chaque utilisateur n’accède qu’à ses propres données. Aucun système n’est totalement infaillible : choisis un mot de passe unique et ne le partage pas."], ["9. Stockage dans ton navigateur","Le site utilise le stockage de ton navigateur pour garder ta session ouverte et mémoriser certains réglages. Nous n’utilisons pas de cookies publicitaires."], ["10. Âge minimum","Le service est réservé aux personnes d’au moins 18 ans."], ["11. Modifications","Nous pouvons modifier cette politique. En cas de changement important, nous t’en informons sur le site ou par e-mail."]]], t:["Conditions d’utilisation",[ ["1. Objet","Workly × Evolia est une plateforme qui met en relation des candidats et des entreprises et propose un assistant carrière (Evolia). En créant un compte, tu acceptes ces conditions."], ["2. Comptes","- Tu fournis des informations exactes et tu gardes ton mot de passe confidentiel.\n- Un compte est personnel. Tu es responsable de l’activité faite avec ton compte.\n- Nous pouvons suspendre un compte qui ne respecte pas ces conditions."], ["3. Candidats","Les informations de ton profil et de ton CV doivent être vraies. En postulant, tu autorises l’entreprise concernée à consulter ces informations et à te contacter par la messagerie de la plateforme."], ["4. Entreprises","- Une entreprise doit être vérifiée avant de publier une offre. Nous pouvons refuser ou retirer une vérification.\n- Les offres doivent correspondre à de vrais postes, être légales et ne contenir aucune discrimination.\n- Il est interdit de demander de l’argent à un candidat (frais de dossier, de formation ou de recrutement).\n- Les données des candidats ne peuvent être utilisées que pour le recrutement concerné.\n- Les outils d’analyse auto {B.mail}.`]]], r:["Abonnement et remboursement",[ ["1. Offres et prix","- Candidats : Gratuit (0 €) ou Premium à 9,99 € par mois (environ 6 553 FCFA), ou 99,90 € par an (environ 65 530 FCFA).\n- Entreprises : Découverte (gratuit, 1 offre active), Starter 15 000 FCFA par mois, Business 35 000 FCFA par mois, Pro 72 000 FCFA par mois. En annuel, tu paies 10 mensualités au lieu de 12 (deux mois offerts) : 150 000, 350 000 et 720 000 FCFA par an.\n- Le contenu de chaque offre est détaillé sur la page Tarifs. Les conversions utilisent le taux fixe 1 € = 655,957 FCFA ; le montant exact est affiché avant le paiement.\n- Offres sur mesure et paiement à l’usage pour les entreprises : sur demande."], ["2. Paiement","Le paiement se fait en ligne par mobile money ou carte bancaire, via un prestataire de paiement sécurisé. Le Premium est activé dès que le prestataire confirme le paiement. Tu reçois une confirmation par e-mail."], ["3. Renouvellement automatique","Les abonnements mensuels sont renouvelés automatiquement chaque mois jusqu’à ce que tu les arrêtes. Un abonnement annuel est renouvelé chaque année."], ["4. Annulation",`Tu peux arrêter ton abonnement à tout moment en écrivant à ${B.mail} depuis l’adresse de ton compte. Tu gardes l’accès Premium jusqu’à la fin de la période déjà payée et aucun nouveau paiement n’est demandé ensuite.`], ["5. Remboursement",`- Tu peux demander un remboursement dans les 7 jours suivant ton premier paiement, si tu n’as pas utilisé les fonctions Premium.\n- Pour une erreur de facturation ou un paiement en double, le remboursement est accordé après vérification.\n- Les demandes se font par e-mail à ${B.mail}, en indiquant l’adresse de ton compte et la date du paiement. Nous répondons sous 48 heures.\n- Le remboursement est effectué par le même moyen de paiement, sous 5 à 10 jours ouvrés selon le prestataire.`], ["6. Changement de prix","Nous prévenons au moins 30 jours à l’avance de toute hausse de prix. Tu peux alors annuler avant son applica         if(biz){try{const cr=await SB.rpc("search_workly_candidates",{p_query:q});candidates=cr.data||[]}catch(e){}}
        const coHtml=companies.map(c=>`<div class="wk-search-item" data-wk-company="${esc(c.id)}">${av(c.logo,c.company||c.nom,40)}<div><b>${esc(c.company||c.nom||"Entreprise")}</b><div class="meta">${c.verified?"Entreprise vérifiée":"Entreprise"} · Ouvrir la page</div></div></div>`).join("");
        const caHtml=candidates.map(c=>`<div class="wk-search-item"><div class="badge">CV</div><div><b>${esc(c.nom||"Candidat")}</b><div class="meta">${esc(c.poste||"Profil candidat")} · Profil visible avec autorisation</div></div></div>`).join("");
        const gate=!biz?'<p class="meta" style="padding:8px 10px">La recherche de candidats est réservée aux offres Business et Pro. Seuls les candidats qui ont autorisé leur profil à être découvert par les entreprises sont affichés.</p>':"";
        results.innerHTML=(coHtml?'<div class="meta" style="padding:7px 10px;font-weight:700">Entreprises</div>'+coHtml:'')+(caHtml?'<div class="meta" style="padding:7px 10px;font-weight:700">Candidats de ton vivier</div>'+caHtml:'')+gate+(!coHtml&&!caHtml?'<p class="meta" style="padding:8px 10px">'+(err?"La recherche d’entreprises n’est pas disponible avec les autorisations actuelles de la base de données.":"Aucun résultat trouvé.")+'</p>':"");
      };
      input.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(run,260)});
      document.getElementById("wk-search-submit").addEventListener("click",run);
      results.addEventListener("click",e=>{const item=e.target.closest("[data-wk-company]");if(!item)return;results.classList.remove("open");A.co(item.dataset.wkCompany)});
      document.addEventListener("click",e=>{if(!e.target.closest("#wk-searchbar"))results.classList.remove("open")});
      input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();run()}if(e.key==="Escape")results.classList.remove("open")});
    }
  };
  installSearch();
  const originalLoadAll=loadAll;
  let channel=null;
  // Petit son "ding" joué à la réception d'une nouvelle notification.
  const playWorklyDing=()=>{try{if(window.__wkPlayNotificationSound)window.__wkPlayNotificationSound();}catch(e){console.log("Son de notification indisponible",e)}};
  const connectRealtime=()=>{
    if(!S.uid||!SB||!SB.channel)return;
    if(channel){try{SB.removeChannel(channel)}catch(e){}}
    channel=SB.channel("wk-notifications-"+S.uid).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+S.uid},async payload=>{
      await loadNotifs();drawNav();playWorklyDing();toast(payload.new&&payload.new.type==="company_post"?"Nouvelle publication d’une entreprise suivie":"Nouvelle notification");
    }).subscribe();
  };
  window.__wkConnectRealtime=connectRealtime;
  loadAll=async function(){await originalLoadAll();installSearch();connectRealtime()};
  if(S.uid)connectRealtime();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.uid)loadNotifs().then(drawNav)});
})();
</script>

<script>
/* WORKLY — Fil communautaire + présentation des options candidat */
try {
  const feedStyle = document.createElement('style');
  feedStyle.textContent = `
    .wk-feed-card{overflow:hidden}
    .wk-feed-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
    .wk-feed-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
    .wk-feed-role{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--brand);font-weight:700}
    .wk-feed-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
    .wk-feed-media{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:12px}
    .wk-feed-media img{width:100%;max-height:340px;object-fit:contain;background:#101828;border-radius:12px}
    .wk-feed-video{display:block;width:100%;max-height:520px;margin-top:12px;border-radius:12px;background:#101828}
    .wk-feed-compose textarea{min-height:90px}
    .wk-media-picker-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
    .wk-media-picker-row button{min-height:42px}
    .wk-comment-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
    .wk-comment-tools button,.wk-reply-tools button{font-size:12px;padding:5px 9px}
    .wk-comment-replies{margin:8px 0 8px 18px;padding-left:12px;border-left:2px solid var(--line)}
    .wk-comment-reply{padding:8px 0;border-bottom:1px solid var(--line)}
    .wk-comment-reply:last-child{border-bottom:0}
    .wk-share-panel{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    @media(max-width:560px){.wk-feed-media{grid-template-columns:1fr}.wk-feed-media img{max-height:420px}.wk-feed-video{max-height:420px}}
    .wk-candidate-offers{margin-top:18px}
    .wk-offer-price{font-size:22px;font-weight:800;color:var(--brand)}
  `;
  document.head.appendChild(feedStyle);

  const wkFeedList = v => {
    if (Array.isArray(v)) return v;
    if (typeof v === 'string') { try { const x=JSON.parse(v); return Array.isArray(x)?x:[]; } catch(e) { return v ? [v] : []; } }
    return [];
  };
  const wkMediaHtml = (photos, videos) => {
    const ps=wkFeedList(photos), vs=wkFeedList(videos);
    const images=ps.filter(u=>!(/\.pdf(?:$|[?#])/i.test(u)));
    const docs=ps.filter(u=>/\.pdf(?:$|[?#])/i.test(u));
    const pi=images.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(u)}" alt="Photo publiée"></a>`).join('');
    const di=docs.map(u=>`<a class="wk-feed-document" href="${esc(u)}" target="_blank" rel="noopener">📄 Ouvrir le document PDF</a>`).join('');
    const vi=vs.map(u=>`<video class="wk-feed-video" controls playsinline preload="metadata"><source src="${esc(u)}">Ton navigateur ne peut pas lire cette vidéo.</video>`).join('');
    return (pi?`<div class="wk-feed-media">${pi}</div>`:'')+di+vi;
  };

  const wkLivePolicy = () => {
    const p=S.user?.plan||'gratuit', r=role();
    if(r!=='entreprise') return {allowed:false,count:0,minutes:0,label:'Entreprises uniquement'};
    if(p==='pro') return {allowed:true,count:8,minutes:60,label:'Pro'};
    if(p==='business') return {allowed:true,count:2,minutes:30,label:'Business'};
    return {allowed:false,count:0,minutes:0,label:'Business ou Pro'};
  };
  const wkLiveCard = () => {
    if(role()!=='entreprise') return '';
    const q=wkLivePolicy();
    return `<section class="wk-live-card card"><div class="wk-live-icon">🔴</div><div class="wk-live-copy"><span class="wk-live-kicker">WORKLY LIVE · ENTREPRISES</span><h2>Studio Live</h2><p>${q.allowed?`Ton offre ${esc(q.label)} inclut jusqu’à ${q.count} live(s) par mois, ${q.minutes} minutes maximum par session.`:'Le direct est réservé aux entreprises disposant d’une offre Business ou Pro.'}</p><button data-a="wkLiveStart" ${q.allowed?'':'class="ghost"'}>${q.allowed?'Préparer un live':'Voir les offres entreprise'}</button></div></section>`;
  };
  A.feed = async function(){
    if (!S.uid) { toast('Connecte-toi pour accéder au fil communautaire'); go('connexion'); return; }
    $('#view').innerHTML='<p class="meta">Chargement du fil communautaire…</p>';
    const r=await SB.rpc('public_workly_feed',{p_limit:100});
    if(r.error){
      $('#view').innerHTML='<h1>Fil d’actualité</h1><div class="card"><p>Le fil communautaire nécessite l’installation de la mise à jour SQL.</p><p class="meta">'+esc(r.error.message)+'</p></div>';
      return;
    }
    const posts=r.data||[];
    const sharesResult=await SB.from('community_post_shares').select('*').order('created_at',{ascending:false}).limit(100);
    const shares=sharesResult.error?[]:(sharesResult.data||[]);
    const postByKey=Object.fromEntries(posts.map(p=>[p.post_key,p]));
    const shareCards=shares.map(sh=>({share:sh,post:postByKey[sh.post_key]})).filter(x=>x.post);
    const composer=(role()==='candidat'||role()==='entreprise')?`
      <div class="card wk-feed-compose">
        <h2>Partager une actualité</h2>
        <p class="meta">Publie un conseil, une réussite ou une actualité professionnelle visible sur WORKLY.</p>
        <textarea id="wkFeedBody" maxlength="2000" placeholder="Qu’aimerais-tu partager ?"></textarea>
        <label class="wk-feed-upload-label">Photos et vidéos</label>
        <input id="wkFeedFiles" type="file" accept="image/*,video/*" multiple hidden>
        <input id="wkFeedDocs" type="file" accept="application/pdf,.pdf" multiple hidden>
        <div class="wk-media-picker-row"><button type="button" class="ghost" data-a="wkChooseMedia">🖼️ Choisir des photos / vidéos</button><button type="button" class="ghost" data-a="wkChooseDocs">📄 Ajouter un PDF</button><span id="wkFeedFileNames" class="meta">Aucun média sélectionné</span></div>
        <p class="meta">Tu peux ajouter des photos, des vidéos ou un PDF. Taille maximale : 15 Mo par image, 50 Mo par vidéo et 20 Mo par PDF.</p>
        <div class="row"><span class="meta">2 000 caractères</span><button data-a="feedPost">Publier</button></div>
      </div>`:'';
    const cards=posts.map(x=>{
      const isCompany=x.author_role==='entreprise';
      const name=esc(x.author_name|| (isCompany?'Entreprise':'Candidat'));
      const avatar=x.avatar_url?`<img class="wk-feed-avatar" src="${esc(x.avatar_url)}" alt="Photo de profil de ${name}">`:`<div class="wk-feed-avatar" style="display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--brand);font-weight:800">${name.charAt(0).toUpperCase()}</div>`;
      const date=x.created_at?new Date(x.created_at).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):'';
      const action=isCompany?`data-a="co" data-id="${esc(x.owner)}"`:'';
      const key=esc(x.post_key||((isCompany?'company:':'candidate:')+x.id));
      return `<article class="card wk-feed-card" data-wk-post-key="${key}"><div class="wk-feed-head" ${action?`style="cursor:pointer" ${action}`:''}>${avatar}<div style="min-width:0;flex:1"><b>${name}</b><div class="meta">${date}</div></div><span class="wk-feed-role">${isCompany?'Entreprise':'Candidat'}</span></div><div class="wk-feed-body">${esc(x.body||'')}</div>${wkMediaHtml(x.photos,x.videos)}<div class="wk-community-social" data-wk-social="${key}"><div class="wk-social-summary" data-wk-summary>Chargement des réactions…</div><div class="wk-social-actions"><button class="ghost" data-a="wkReactionPicker" data-id="${key}">😊 Réagir</button><button class="ghost" data-a="wkComments" data-id="${key}">💬 Commenter</button><button class="ghost" data-a="wkShare" data-id="${key}">↗ Partager à l’extérieur</button><button class="ghost" data-a="wkShareToPage" data-id="${key}">➕ Partager sur ma page</button></div><div class="wk-comments" id="wk-comments-${key.replace(/[^a-zA-Z0-9_-]/g,'_')}"></div></div></article>`;
    }).join('');
    const sharedCards=shareCards.map(({share,post})=>{
      const sharedBy=share.sharer_id===S.uid?(S.user?.company||S.user?.nom||'Toi'):'Un membre Workly';
      return `<article class="card wk-feed-card"><div class="meta" style="margin-bottom:8px">↗ ${esc(sharedBy)} a partagé une publication</div>${share.caption?`<p>${esc(share.caption)}</p>`:''}<div class="wk-feed-head">${post.avatar_url?`<img class="wk-feed-avatar" src="${esc(post.avatar_url)}" alt="">`:`<div class="wk-feed-avatar">${esc((post.author_name||'M').charAt(0))}</div>`}<div><b>${esc(post.author_name||'Membre')}</b><div class="meta">Publication d’origine</div></div></div><div class="wk-feed-body">${esc(post.body||'')}</div>${wkMediaHtml(post.photos,post.videos)}</article>`;
    }).join('');
    $('#view').innerHTML=`<div class="wk-feed-top"><div><h1>Fil d’actualité</h1><p class="sub">Les actualités, photos et vidéos publiées sur WORKLY.</p></div><span class="wk-feed-pill">ACTUALITÉS</span></div>${composer}${cards}${sharedCards}${(cards||sharedCards)?'':'<div class="card meta">Aucune publication pour le moment. Reviens bientôt !</div>'}`;
    await wkRefreshCommunitySocial(posts.map(x=>x.post_key).filter(Boolean));
    wkObserveVideos();
    window.scrollTo(0,0);
  };

  const wkSocialCache={};
  async function wkRefreshCommunitySocial(keys){
    if(!keys.length)return;
    const r=await SB.rpc('community_post_social',{p_keys:keys});
    if(r.error){document.querySelectorAll('[data-wk-summary]').forEach(e=>e.textContent='Interactions indisponibles : applique la migration SQL Workly Community Social.');return;}
    (r.data||[]).forEach(x=>wkSocialCache[x.post_key]=x);
    document.querySelectorAll('[data-wk-social]').forEach(el=>{
      const d=wkSocialCache[el.dataset.wkSocial];if(!d)return;
      const counts=d.counts||{},total=Object.values(counts).reduce((a,b)=>a+(Number(b)||0),0);
      const sum=el.querySelector('[data-wk-summary]');if(sum)sum.textContent=`${total} réaction(s) · ${d.comments_count||0} commentaire(s)`;
      const b=el.querySelector('[data-a="wkReact"]');if(b){b.textContent=d.mine?'❤️ J’aime déjà':'👍 J’aime';b.classList.toggle('wk-liked',!!d.mine)}
    });
    await Promise.all(keys.map(async key=>{
      const q=await SB.rpc('community_post_reaction_summary',{p_post_key:key});
      if(q.error||!q.data?.length)return;
      const d=q.data[0],counts=d.counts||{},total=Object.values(counts).reduce((a,b)=>a+(Number(b)||0),0);
      const el=document.querySelector(`[data-wk-social="${CSS.escape(key)}"]`);
      const sum=el?.querySelector('[data-wk-summary]');if(sum){const old=wkSocialCache[key]?.comments_count||0;sum.textContent=`${total} réaction(s) · ${old} commentaire(s)`;}
      const b=el?.querySelector('[data-a="wkReactionPicker"]');if(b){const opt=wkReactionOptions.find(x=>x[0]===d.mine);b.textContent=opt?`${opt[1]} ${opt[2]}`:'😊 Réagir';}
    }));
  }
  const wkReactionOptions=[['like','👍','J’aime'],['love','❤️','J’adore'],['haha','😂','Ça me fait rire'],['wow','😮','Waouh'],['sad','😢','Triste'],['clap','👏','Bravo']];
  A.wkReactionPicker=key=>{
    const el=document.querySelector(`[data-wk-social="${CSS.escape(key)}"] .wk-social-actions`);if(!el)return;
    let panel=el.querySelector('.wk-reaction-picker');
    if(panel){panel.remove();return;}
    el.insertAdjacentHTML('beforeend',`<div class="wk-reaction-picker" style="display:flex;gap:6px;flex-wrap:wrap;width:100%;padding:8px 0">${wkReactionOptions.map(([k,emoji,label])=>`<button class="ghost" data-a="wkSetReaction" data-id="${key}|${k}" title="${label}">${emoji} ${label}</button>`).join('')}</div>`);
  };
  A.wkSetReaction=async value=>{
    const [key,kind]=value.split('|');
    const r=await SB.rpc('community_set_post_reaction',{p_post_key:key,p_kind:kind});
    if(r.error){toast('Réaction impossible : '+r.error.message);return;}
    await wkRefreshCommunitySocial([key]);
    const panel=document.querySelector(`[data-wk-social="${CSS.escape(key)}"] .wk-reaction-picker`);if(panel)panel.remove();
  };
  A.wkReact=async key=>{
    const r=await SB.rpc('community_react_post',{p_post_key:key,p_kind:'like'});
    if(r.error){toast('Réaction impossible : '+r.error.message);return;}
    await wkRefreshCommunitySocial([key]);
  };
  A.wkComments=async key=>{
    const safe=key.replace(/[^a-zA-Z0-9_-]/g,'_'),el=$('#wk-comments-'+safe);if(!el)return;
    if(el.dataset.open==='1'){el.innerHTML='';el.dataset.open='0';return;}
    el.dataset.open='1';el.innerHTML='<p class="meta">Chargement des commentaires…</p>';
    const r=await SB.rpc('community_comments_list',{p_post_key:key});
    if(r.error){el.innerHTML='<p class="meta">Commentaires indisponibles. Vérifie la migration SQL.</p>';return;}
    const comments=r.data||[];
    const rendered=await Promise.all(comments.map(async c=>{
      const cid=String(c.id);
      const [rr,rs]=await Promise.all([
        SB.rpc('community_comment_replies_list',{p_comment_id:cid}),
        SB.rpc('community_comment_reaction_summary',{p_comment_id:cid})
      ]);
      const replies=rr.error?[]:(rr.data||[]),stat=rs.error?{likes:0,dislikes:0,mine:null}:(rs.data?.[0]||{likes:0,dislikes:0,mine:null});
      const replyHtml=replies.map(q=>`<div class="wk-comment-reply"><b>${esc(q.author_name||'Membre')}</b><p>${esc(q.body)}</p>${q.can_delete?`<button class="lnk" data-a="wkReplyDelete" data-id="${q.id}|${key}|${cid}">Supprimer</button>`:''}</div>`).join('');
      return `<div class="wk-comment" data-wk-comment="${esc(cid)}"><b>${esc(c.author_name||'Membre')}</b><span class="meta"> · ${c.created_at?new Date(c.created_at).toLocaleString('fr-FR'):''}</span><p>${esc(c.body)}</p><div class="wk-comment-tools"><button class="ghost" data-a="wkCommentReplyForm" data-id="${key}|${cid}">↩ Répondre</button><button class="ghost" data-a="wkCommentReact" data-id="${cid}|like">👍 J’aime (${stat.likes||0})</button><button class="ghost" data-a="wkCommentReact" data-id="${cid}|dislike">👎 Je n’aime pas (${stat.dislikes||0})</button>${c.can_delete?`<button class="lnk" data-a="wkCommentDelete" data-id="${c.id}|${key}">Supprimer</button>`:''}</div><div class="wk-reply-form" id="wk-reply-form-${safe}-${cid.replace(/[^a-zA-Z0-9_-]/g,'_')}"></div><div class="wk-comment-replies">${replyHtml}</div></div>`;
    }));
    el.innerHTML=rendered.join('')+`<div class="wk-comment-form"><input id="wk-comment-input-${safe}" maxlength="1000" placeholder="Écrire un commentaire…"><button data-a="wkCommentSend" data-id="${key}">Envoyer</button></div>`;
  };
  A.wkCommentSend=async key=>{
    const safe=key.replace(/[^a-zA-Z0-9_-]/g,'_'),i=$('#wk-comment-input-'+safe),body=(i?.value||'').trim();if(!body)return;
    const r=await SB.rpc('community_add_comment',{p_post_key:key,p_body:body});if(r.error){toast('Commentaire impossible : '+r.error.message);return;}
    await A.wkComments(key);await A.wkComments(key);await wkRefreshCommunitySocial([key]);
  };
  A.wkCommentDelete=async value=>{
    const [id,key]=value.split('|');if(!confirm('Supprimer ce commentaire ?'))return;
    const r=await SB.rpc('community_delete_comment',{p_comment_id:Number(id)});if(r.error){toast(r.error.message);return;}
    const el=document.querySelector(`[data-wk-social="${CSS.escape(key)}"] .wk-comments`);if(el)el.dataset.open='0';await A.wkComments(key);await wkRefreshCommunitySocial([key]);
  };
  A.wkCommentReplyForm=(value)=>{
    const [key,cid]=value.split('|');const safe=key.replace(/[^a-zA-Z0-9_-]/g,'_'),cidSafe=cid.replace(/[^a-zA-Z0-9_-]/g,'_');
    const box=$('#wk-reply-form-'+safe+'-'+cidSafe);if(!box)return;
    box.innerHTML=`<div class="wk-comment-form"><input id="wk-reply-input-${safe}-${cidSafe}" maxlength="1000" placeholder="Écrire une réponse…"><button data-a="wkCommentReplySend" data-id="${key}|${cid}">Répondre</button></div>`;
  };
  A.wkCommentReplySend=async value=>{
    const [key,cid]=value.split('|'),safe=key.replace(/[^a-zA-Z0-9_-]/g,'_'),cidSafe=cid.replace(/[^a-zA-Z0-9_-]/g,'_');
    const input=$('#wk-reply-input-'+safe+'-'+cidSafe),body=(input?.value||'').trim();if(!body)return;
    const r=await SB.rpc('community_add_comment_reply',{p_post_key:key,p_comment_id:cid,p_body:body});
    if(r.error){toast('Réponse impossible : '+r.error.message);return;}
    const el=$('#wk-comments-'+safe);if(el)el.dataset.open='0';await A.wkComments(key);toast('Réponse publiée');
  };
  A.wkCommentReact=async value=>{
    const [cid,reaction]=value.split('|');
    const r=await SB.rpc('community_comment_react',{p_comment_id:cid,p_reaction:reaction});
    if(r.error){toast('Réaction au commentaire impossible : '+r.error.message);return;}
    const card=document.querySelector(`[data-wk-comment="${CSS.escape(cid)}"]`);const post=card?.closest('[data-wk-social]')?.dataset.wkSocial;
    if(post){const el=$('#wk-comments-'+post.replace(/[^a-zA-Z0-9_-]/g,'_'));if(el)el.dataset.open='0';await A.wkComments(post);}
  };
  A.wkReplyDelete=async value=>{
    const [id,key]=value.split('|');if(!confirm('Supprimer cette réponse ?'))return;
    const r=await SB.rpc('community_delete_comment_reply',{p_reply_id:Number(id)});if(r.error){toast(r.error.message);return;}
    const el=$('#wk-comments-'+key.replace(/[^a-zA-Z0-9_-]/g,'_'));if(el)el.dataset.open='0';await A.wkComments(key);
  };
  A.wkChooseMedia=()=>$('#wkFeedFiles')?.click();
  A.wkChooseDocs=()=>$('#wkFeedDocs')?.click();
  document.addEventListener('change',e=>{if(e.target?.id==='wkFeedFiles'||e.target?.id==='wkFeedDocs'){
    const files=[...Array.from($('#wkFeedFiles')?.files||[]),...Array.from($('#wkFeedDocs')?.files||[])];const label=$('#wkFeedFileNames');
    if(label)label.textContent=files.length?files.map(f=>f.name).join(', '):'Aucun média sélectionné';
  }});
  A.wkShareToPage=async key=>{
    const caption=(prompt('Ajouter un message à ton partage (facultatif) :')||'').trim();
    const r=await SB.rpc('community_share_post_to_page',{p_post_key:key,p_caption:caption});
    if(r.error){toast('Partage sur ta page impossible : '+r.error.message);return;}
    toast('Publication partagée sur ta page Workly');
  };
  A.wkShare=async key=>{
    const card=document.querySelector(`[data-wk-post-key="${CSS.escape(key)}"]`);const body=card?.querySelector('.wk-feed-body')?.textContent||'Publication Workly';
    const url=location.origin+location.pathname+'#feed';
    try{if(navigator.share){await navigator.share({title:'Workly · Fil d’actualité',text:body.slice(0,180),url});}else{await navigator.clipboard.writeText(body+' '+url);toast('Lien de la publication copié');}}catch(e){}
  };
  A.wkLiveStart=()=>{
    if(role()!=='entreprise'){toast('Seules les entreprises peuvent organiser un live.');A.feed();return;}
    const q=wkLivePolicy();if(!q.allowed){toast('Le live est inclus dans Premium candidat, Business et Pro entreprise.');go('tarifs');return;}

  function wkFileMime(file){
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    const known={
      jpg:'image/jpeg',jpeg:'image/jpeg',jpe:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif',
      bmp:'image/bmp',avif:'image/avif',heic:'image/heic',heif:'image/heif',
      mp4:'video/mp4',m4v:'video/mp4',webm:'video/webm',mov:'video/quicktime',qt:'video/quicktime',
      pdf:'application/pdf'
    };
    return known[ext] || file.type || 'application/octet-stream';
  }
  function wkFileKind(file){
    const mime=wkFileMime(file);
    if(mime.startsWith('image/')) return 'image';
    if(mime.startsWith('video/')) return 'video';
    if(mime==='application/pdf' || /\.pdf$/i.test(file.name)) return 'pdf';
    return 'unsupported';
  }
  async function wkUploadPostFile(file, prefix){
    const kind=wkFileKind(file), mime=wkFileMime(file);
    if(kind==='unsupported') throw new Error('Format non autorisé. Formats acceptés : JPG, JPEG, PNG, WebP, GIF, BMP, AVIF, MP4, WebM, MOV et PDF.');
    const max=kind==='video'?50*1024*1024:kind==='pdf'?20*1024*1024:15*1024*1024;
    if(file.size>max) throw new Error(kind==='video'?'Vidéo limitée à 50 Mo.':kind==='pdf'?'PDF limité à 20 Mo.':'Image limitée à 15 Mo.');
    const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').toLowerCase()||'bin';
    const path=S.uid+'/'+prefix+'-'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;

    if(up.error) throw new Error(up.error.message);
    return {url:SB.storage.from('job-photos').getPublicUrl(path).data.publicUrl,kind};
  }
  async function wkPhotoAsPng(file){
    const objectUrl=URL.createObjectURL(file);
    try{
      const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error("Image illisible"));i.src=objectUrl;});
      const scale=Math.min(1,2000/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
      const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext("2d");if(!ctx)throw new Error("Conversion d’image indisponible");ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error("Conversion PNG impossible")),"image/png"));
      return blob;

    #wk-sound-status{font-size:13px;color:var(--muted);margin-top:8px}
  `;
  document.head.appendChild(passCss);
  // Son : l'AudioContext doit être déverrouillé par une action explicite de l'utilisateur.
  let wkAudio=null,wkAudioReady=false;
  const wkSoundWanted=()=>load('notification_sound',false)===true;
  async function wkUnlockAudio(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return false;
    if(!wkAudio)wkAudio=new AC();
    if(wkAudio.state==='suspended')await wkAudio.resume();
    wkAudioReady=wkAudio.state==='running';

  }
  async function wkEnableSound(){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){toast('Ce navigateur ne prend pas en charge le son des notifications.');return}
    try{
      const ready=await wkUnlockAudio();
      if(!ready){toast('Le navigateur bloque encore le son. Clique à nouveau sur Activer le son.');return}

      toast('Son des notifications activé');

  const oldSettings=vParam;

    const view=document.getElementById('view');if(!view||view.querySelector('#wk-sound-card'))return;
    const card=document.createElement('section');card.className='card';card.id='wk-sound-card';

    const langCard=[...view.querySelectorAll('.card')].find(c=>c.textContent.includes('Langue'));
    if(langCard)langCard.insertAdjacentElement('afterend',card);else view.appendChild(card);
    card.querySelector('#wk-enable-sound').addEventListener('click',wkEnableSound);
  };
  // Réutilise un contexte audio déverrouillé au lieu d'en créer un nouveau à chaque notification.
  window.__wkPlayNotificationSound=async function(){
    try{
      if(!wkSoundWanted()||!wkAudioReady||!wkAudio)return;
      if(wkAudio.state==='suspended')await wkAudio.resume();
      if(wkAudio.state!=='running')return;
      const t=wkAudio.currentTime,o=wkAudio.createOscillator(),g=wkAudio.createGain();
      o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1175,t+.11);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.48);
      o.connect(g);g.connect(wkAudio.destination);o.start(t);o.stop(t+.49);
    }catch(e){console.debug('Notification audio bloquée',e)}
  };
  // Laisse le bouton de notification natif de Workly réactiver l'audio après chaque session.
  document.addEventListener('pointerdown',()=>{if(wkSoundWanted()){wkUnlockAudio().catch(()=>{});}else if(wkAudio&&wkAudio.state==='suspended'){wkAudio.resume().catch(()=>{});wkAudioReady=wkAudio.state==='running';}},{passive:true});
}catch(e){console.error('WORKLY international/audio/passe candidat:',e)}})();
</script>

   if(k==='academy')return `<h1>WORKLY Academy</h1><p class="sub">Ton plan de progression et tes objectifs professionnels.</p><div class="wkplus-card"><label>Compétence à développer</label><input id="wkAcademySkill" placeholder="Ex. Anglais professionnel"><label>Objectif de la semaine</label><input id="wkAcademyGoal" placeholder="Ex. 3 séances de pratique"><button data-a="wkacademysave">Ajouter un objectif</button><div id="wkAcademyList">${wkStore('academy_'+(S.uid||'guest'),[]).map(x=>`<p>🎓 <b>${esc(x.skill)}</b> — ${esc(x.goal)}</p>`).join('')}</div></div>`;
   if(k==='security')return `<h1>Sécurité & confidentialité</h1><div class="wkplus-card"><h2>Bonnes pratiques</h2><ul class="wkplus-list"><li>Utilise un mot de passe unique et robuste.</li><li>Ne partage jamais ton code de connexion ou tes clés API.</li><li>Vérifie les liens avant d’envoyer tes documents.</li><li>Déconnecte-toi sur les appareils partagés.</li></ul><button class="ghost" data-a="go" data-id="compte">Gérer mon compte</button><button class="ghost" data-a="go" data-id="parametres">Paramètres et confidentialité</button><p class="meta">La journalisation serveur, les sauvegardes automatiques et la détection anti-fraude doivent être configurées dans Supabase avant d’être annoncées comme actives.</p></div>`;
   if(k==='notifications')return `<h1>Centre de notifications</h1><div class="wkplus-card"><p>Le navigateur peut bloquer le son tant que tu n’as pas interagi avec la page.</p><button data-a="wksound">Activer et tester le son</button><label style="margin-top:12px"><input id="wkSoundEnabled" type="checkbox" ${wkStore('sound',true)?'checked':''}> Autoriser le son des notifications sur cet appareil</label><p class="meta">Le son fonctionne après un clic utilisateur et selon les réglages du navigateur.</p><button class="ghost" data-a="go" data-id="notifications">Voir mes notifications reçues</button></div>`;
   return `<h1>WORKLY — Espace d’évolution</h1><p class="sub">Tous les nouveaux modules réunis au même endroit. Choisis un outil pour l’ouvrir.</p><div class="wkplus-grid wkplus-home-grid">${wkRoleFeatures().map(x=>`<button class="wkplus-card" style="text-align:left;color:var(--text);cursor:pointer" data-a="wkfeature" data-id="${x[0]}"><div class="wkplus-icon">${x[1]}</div><h2>${x[2]}</h2><p>${x[3]}</p><span class="wkplus-pill">Ouvrir le module →</span></button>`).join('')}</div><div class="wkplus-note"><b>À savoir :</b> les écrans, formulaires et enregistrements locaux sont utilisables dans cette version. Les fonctions qui impliquent une IA distante, une vérification officielle, des paiements, des invitations ou des données partagées nécessitent encore leurs connexions sécurisées.</div>`;
  }
  function vWorklyPlus(){if(!S.user){go('connexion');return}if(!wkFeatureAllowed(wkActive)&&wkActive!=='home')wkActive='home';const roleLabel=role()==='entreprise'?'Espace entreprise':'Espace candidat';const back=wkActive!=='home'?'<button class="ghost" data-a="wkfeature" data-id="home">← Retour aux modules</button>':'';$('#view').innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div><h1>WORKLY+</h1><p class="sub">${roleLabel}</p></div></div>${back}<div id="wkPlusContent">${wkPanel(wkActive)}</div>`;}
  window.__wkVPlus=vWorklyPlus;
  A.wkfeature=k=>{const next=k||'home';if(next!=='home'&&!wkFeatureAllowed(next)){toast('Ce module appartient à l’autre espace.');wkActive='home';vWorklyPlus();return}wkActive=next;vWorklyPlus()};
  A.wkpasssave=()=>{const key='profile_'+(S.uid||'guest'),d=wkStore(key,{});Object.assign(d,{title:$('#wkPassTitle').value,city:$('#wkPassCity').value,country:$('#wkPassCountry').value,skills:$('#wkPassSkills').value.split(',').map(x=>x.trim()).filter(Boolean),bio:$('#wkPassBio').value});wkSave(key,d);toast('Candidate Pass enregistré sur cet appareil')};
  A.wkmatch=()=>{
    const raw=$('#wkMatchSkills')?.value||'', profile=S.user||{};
    const terms=[...new Set((raw+','+(profile.poste||'')+','+(profile.field||'')).toLowerCase().split(/[,;\n]/).flatMap(x=>x.trim().split(/\s+/)).filter(x=>x.length>2))];
    const normText=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const matches=(jobs()||[]).map(j=>{
      const title=normText(j.title),field=normText(j.field||j.sector),desc=normText(j.description),tags=normText(Array.isArray(j.tags)?j.tags.join(' '):j.tags),company=normText(j.company);
      const hit=terms.filter(t=>[title,field,desc,tags].some(v=>v.includes(normText(t))));
      const titleHits=terms.filter(t=>title.includes(normText(t))).length;
      const fieldHits=terms.filter(t=>field.includes(normText(t))).length;
      const tagHits=terms.filter(t=>tags.includes(normText(t))).length;
      const descHits=terms.filter(t=>desc.includes(normText(t))).length;
      let score=terms.length?Math.round(Math.min(100,(titleHits*18+fieldHits*16+tagHits*12+descHits*5)/Math.max(1,terms.length)*1.5)):0;
      if(profile.field&&normText(profile.field)===field)score=Math.min(100,score+15);
      if(profile.poste&&title.includes(normText(profile.poste)))score=Math.min(100,score+10);
      if(profile.pays&&j.country&&normText(profile.pays)===normText(j.country))score=Math.min(100,score+5);
      return {j,score,hit:[...new Set(hit)]};
    }).sort((a,b)=>b.score-a.score).slice(0,15);
    const out=$('#wkMatchResults'); if(!out)return;
    out.innerHTML=matches.length?`<p class="meta">Classement calculé à partir des compétences, du métier, du secteur et du contenu des offres disponibles dans WORKLY. C’est une première aide algorithmique locale, pas encore une analyse par IA distante.</p>`+matches.map(x=>`<div class="wkplus-card"><div class="row"><b>${esc(x.j.title)}</b><span class="wkplus-pill">${x.score}% de compatibilité</span></div><p>${esc(x.j.company||'Entreprise')} · ${esc(x.j.city||'Ville non précisée')} · ${esc(x.j.country||'Pays non précisé')}</p><div class="wkplus-progress"><span style="width:${x.score}%"></span></div><p class="meta">Points communs : ${esc(x.hit.join(', ')||'Peu de correspondances détectées')}</p><button class="ghost" data-a="detail" data-id="${esc(x.j.id)}">Voir l’offre</button></div>`).join(''):'<p class="meta">Aucune offre disponible à analyser pour le moment.</p>';
  }
  const wkMeetUrl=()=>{const room=($('#wkMeetRoom')?.value||'').trim().replace(/[^a-zA-Z0-9_-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');return room?'https://meet.jit.si/WORKLY-'+room:''};
  A.wkmeetcreate=()=>{let room=($('#wkMeetRoom')?.value||'').trim();if(!room)room='entretien-'+Math.random().toString(36).slice(2,9);$('#wkMeetRoom').value=room;wkSave('meetroom_'+(S.uid||'guest'),room);const url=wkMeetUrl();$('#wkMeetLink').innerHTML=`Lien à partager : <a href="${url}" target="_blank" rel="noopener">${url}</a>`;window.open(url,'_blank','noopener');toast('Salle créée : partage le lien avec ton interlocuteur')};
  A.wkmeetjoin=()=>{const room=($('#wkMeetJoinRoom')?.value||$('#wkMeetRoom')?.value||'').trim();if(!room){toast('Saisis uniquement le nom de la réunion');return}const clean=room.replace(/[^a-zA-Z0-9_-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');if(!clean){toast('Nom de réunion invalide');return}const url='https://meet.jit.si/WORKLY-'+clean;wkSave('meetroom_'+(S.uid||'guest'),clean);const info=$('#wkMeetJoinInfo');if(info)info.innerHTML=`Ouverture de la salle : <b>${esc(clean)}</b>`;const link=$('#wkMeetLink');if(link)link.innerHTML=`Lien de réunion : <a href="${url}" target="_blank" rel="noopener">${url}</a>`;window.open(url,'_blank','noopener')};
  A.wkmeetjoinbyname=()=>A.wkmeetjoin();
  A.wkmeetcopy=()=>{const url=wkMeetUrl();if(!url){toast('Crée ou indique d’abord une salle');return}if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast('Lien de visioconférence copié')).catch(()=>toast(url))}else toast(url)};
  A.wkrepadd=()=>{const skill=$('#wkRepSkill').value.trim();if(!skill){toast('Ajoute une compétence ou certification');return}const a=wkStore('rep_'+(S.uid||'guest'),[]);a.push({skill,org:$('#wkRepOrg').value.trim(),url:$('#wkRepUrl').value.trim(),verified:false});wkSave('rep_'+(S.uid||'guest'),a);toast('Élément ajouté au portfolio');A.wkfeature('reputation')};
  A.wkintsave=()=>{const roleName=$('#wkIntRole').value.trim();if(!roleName){toast('Indique le poste concerné');return}const a=wkStore('interviews_'+(S.uid||'guest'),[]);a.push({role:roleName,date:$('#wkIntDate').value,notes:$('#wkIntNotes').value});wkSave('interviews_'+(S.uid||'guest'),a);toast('Préparation enregistrée');A.wkfeature('interview')};
  A.wkglobalsave=()=>{wkSave('global_'+(S.uid||'guest'),{country:$('#wkCountry').value,city:$('#wkGlobalCity').value,lang:$('#wkGlobalLang').value,mobility:$('#wkMobility').value});toast('Préférences internationales enregistrées')};
  A.wkacademysave=()=>{const skill=$('#wkAcademySkill').value.trim(),goal=$('#wkAcademyGoal').value.trim();if(!skill){toast('Indique une compétence');return}const a=wkStore('academy_'+(S.uid||'guest'),[]);a.push({skill,goal});wkSave('academy_'+(S.uid||'guest'),a);toast('Objectif ajouté');A.wkfeature('academy')};
  A.wksound=()=>{try{const C=window.AudioContext||window.webkitAudioContext;if(!C){toast('Audio non pris en charge par ce navigateur');return}const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.18);wkSave('sound',true);toast('Son activé sur cet appareil')}catch(e){toast('Impossible de démarrer le son : vérifie les réglages du navigateur')}};
  document.addEventListener('change',e=>{if(e.target.id==='wkPassFile'&&e.target.files?.[0]){const f=e.target.files[0];if(!f.type.startsWith('image/'))return toast('Choisis un fichier image');if(f.size>3*1024*1024)return toast('Image limitée à 3 Mo');const r=new FileReader();r.onload=()=>{const key='profile_'+(S.uid||'guest'),d=wkStore(key,{});d.photo=r.result;wkSave(key,d);const im=$('#wkPassPhoto');if(im)im.src=r.result};r.readAsDataURL(f)}if(e.target.id==='wkCountrySearch'){const q=e.target.value.toLowerCase(),sel=$('#wkCountry');if(sel){sel.innerHTML=wkCountries.filter(x=>x.toLowerCase().includes(q)).map(x=>`<option>${esc(x)}</option>`).join('')}}if(e.target.id==='wkSoundEnabled')wkSave('sound',e.target.checked)});
  const oldDraw=drawNav;drawNav=function(r){oldDraw(r);const n=$('#nav');if(n&&!n.querySelector('[data-wkplus-nav]'))n.insertAdjacentHTML('beforeend',`<a href="#worklyplus" data-wkplus-nav class="${r==='worklyplus'?'on':''}">${role()==='entreprise'?'WORKLY+ Entreprise':'WORKLY+ Candidat'}</a>`);else{const a=n?.querySelector('[data-wkplus-nav]');if(a){a.classList.toggle('on',r==='worklyplus');a.textContent=role()==='entreprise'?'WORKLY+ Entreprise':'WORKLY+ Candidat'}}};
  const oldRender=render;render=function(){if(route()==='worklyplus'){drawNav('worklyplus');vWorklyPlus();window.scrollTo(0,0)}else oldRender()};
  /* Étend la liste de langues des paramètres sans prétendre traduire les contenus non raccordés. */
  const oldParam=vParam;vParam=function(){oldParam();const box=$('#view');if(!box||box.querySelector('#wkLanguageFull'))return;const current=wkStore('language','fr');box.insertAdjacentHTML('afterbegin',`<div class="card" id="wkLanguageFull"><h2>🌐 Langues disponibles</h2><p class="meta">Choisis la langue préférée pour les nouveaux modules. La traduction complète de chaque contenu et la langue de réponse d’Evolia demandent encore le raccordement du moteur IA et du système de traduction.</p><select id="wkLanguageSelect">${languages.map(x=>`<option value="${x[0]}" ${current===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button style="margin-top:8px" data-a="wklangsave">Enregistrer la langue</button></div>`)};
  A.wklangsave=()=>{wkSave('language',$('#wkLanguageSelect').value);save('lang',$('#wkLanguageSelect').value);toast('Préférence de langue enregistrée')};
  /* Le visuel des photos reste dans le contenu, avec conservation des proportions. */
  const imgStyle=document.createElement('style');imgStyle.textContent='img:not(.wk-feed-avatar){object-position:center} .wk-feed-media img{object-fit:contain!important;background:var(--bg)!important} .wk-feed-media{align-items:start}';document.head.appendChild(imgStyle);
 }catch(e){console.error('WORKLY+ extension',e)}
})();
</script>

<script>
(function(){
 const groups=()=>!S.user?[{title:'Navigation',items:[['accueil','Accueil'],['offres','Offres'],['tarifs','Tarifs'],['inscription','Créer un compte'],['connexion','Connexion'],['parametres','Paramètres']]}]:role()==='candidat'?[{title:'Découvrir',items:[['feed','Fil d’actualité'],['offres','Offres d’emploi']]},{title:'Ma carrière',items:[['candidatures','Mes candidatures'],['evolia','Evolia'],['worklyplus','WORKLY+']]},{title:'Mon espace',items:[['messages','Messages'+bd()],['tableau','Tableau de bord'],['compte','Mon profil'],['tarifs','Abonnement'],['parametres','Paramètres']]}]:[{title:'Pilotage',items:[['tableau','Tableau de bord']]},{title:'Recrutement',items:[['recruter','Publier une offre'],['recus','Candidatures reçues'+rc()],['talents','Vivier de talents'],['offres','Mes offres']]},{title:'Communication',items:[['feed','Fil d’actualité'],['messages','Messages'+bd()]]},{title:'Gestion',items:[['compte','Profil entreprise'],['evolia','Evolia'],['tarifs','Abonnement & crédits'],['parametres','Paramètres']]}];
 const oldDraw=drawNav;
 drawNav=function(r){r=r||route();const gs=groups();$('#nav').innerHTML=gs.map((g,i)=>`<details class="wk-nav-group" ${g.items.some(x=>x[0]===r)?'open':''}>${g.title?`<summary>${g.title}</summary>`:''}<div class="wk-nav-links">${g.items.map(x=>`<a href="#${x[0]}" class="${x[0]===r?'on':''}">${x[1]}</a>`).join('')}</div></details>`).join('')+(S.isAdmin?'<a href="admin.html">Administration</a>':'');document.title=(unread()?'('+unread()+') ':'')+'Workly × Evolia';const nb=$('#bell');if(nb)nb.innerHTML=`<button class="ghost" data-a="go" data-id="parametres" aria-label="Paramètres">⚙️</button> `+(S.user?`<button class="ghost" data-a="go" data-id="notifications">🔔${unreadN()?' '+unreadN():''}</button>`:'');};
 // Open/close the compact sidebar on mobile; a menu button is added beside the logo.
 const addMobileToggle=()=>{const h=document.querySelector('header');if(h&&!h.querySelector('.wk-menu-toggle')){const b=document.createElement('button');b.className='wk-menu-toggle ghost';b.type='button';b.textContent='☰';b.setAttribute('aria-label','Ouvrir le menu');b.style.cssText='display:none;margin-right:8px';b.onclick=()=>$('#nav').classList.toggle('wk-nav-open');h.querySelector('.logo')?.before(b);const st=document.createElement('style');st.textContent='@media(max-width:850px){.wk-menu-toggle{display:inline-flex!important}}';document.head.append(st)}};addMobileToggle();
 // Reactions: click on Like opens an emoji-only horizontal selector.

<script id="workly-v12-referral-communities-trial">
(function(){
 try{
  const $q=(s)=>document.querySelector(s);
  const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // Le code saisi à l'inscription est traité dès que le compte candidat est connecté.
  const oldLoad=loadAll;
  loadAll=async function(){
   await oldLoad();
   if(S.uid&&S.user?.role==='candidat'){
    const code=localStorage.getItem('wk3_pending_referral');
    if(code){
     const rr=await SB.rpc('redeem_workly_referral',{p_code:code});
     if(!rr.error){localStorage.removeItem('wk3_pending_referral');if(rr.data?.ok)toast('Parrainage validé : 3 crédits offerts. Le parrain reçoit 5 crédits.');else if(rr.data?.reason==='already_referred')toast('Ce compte a déjà bénéficié d’un parrainage.');else if(rr.data?.reason==='invalid_code')toast('Code de parrainage invalide.');}
     else console.warn('Parrainage WORKLY:',rr.error.message);
    }
   }
  };
  // Offre d’essai affichée après la création du compte : le candidat reste Gratuit tant qu’il n’active pas l’essai.
  const oldFeed=A.feed;
  A.feed=async function(){
   await oldFeed();
   if(role()==='candidat'&&S.user&&sessionStorage.getItem('wk3_offer_trial')==='1'&&!S.user.candidate_trial_used){
    if(!$q('[data-wk-trial-offer]')){
     const box=document.createElement('section');box.className='card';box.dataset.wkTrialOffer='1';
     box.innerHTML='<h2>Découvrez WORKLY Premium pendant 7 jours</h2><p>Votre compte reste sur la formule gratuite. Vous pouvez essayer Premium gratuitement pendant 7 jours, sans carte bancaire. À la fin de l’essai, votre compte revient automatiquement à Gratuit. Aucun prélèvement automatique.</p><div class="btns"><button data-a="wkStartTrial">Activer mes 7 jours gratuits</button><button class="ghost" data-wk-trial-later>Continuer en Gratuit</button></div>';
     const top=$q('#view .wk-feed-top');if(top)top.after(box);else $q('#view')?.prepend(box);
    }
   }
  };
  document.addEventListener('click',e=>{if(e.target.closest('[data-wk-trial-later]')){sessionStorage.removeItem('wk3_offer_trial');e.target.closest('[data-wk-trial-offer]')?.remove();toast('Tu peux activer ton essai plus tard depuis Mon profil.');}});
 }catch(e){console.error('WORKLY V12 intégration:',e)}
})();

<script id="wk-candidate-settings-corrections">
(function(){try{
  const AD_CONTENT=`<h3>Quelles données peuvent être concernées ?</h3><p>Selon les fonctionnalités activées, il peut s’agir des informations de profil que tu as renseignées, de ta langue, de ton pays ou de ta ville, de tes préférences professionnelles, des pages et offres consultées, ainsi que de tes interactions avec les contenus sponsorisés. Les informations sensibles, les mots de passe et le contenu privé des messages ne doivent pas être utilisés pour personnaliser des publicités.</p><h3>Pourquoi ces données pourraient-elles être utilisées ?</h3><p>Elles peuvent servir à mesurer la visibilité d’une campagne, limiter la répétition d’une annonce, comprendre les performances globales des publications sponsorisées et, si cette fonction est activée avec une base légale appropriée, présenter des contenus pertinents selon les préférences professionnelles déclarées.</p><h3>Ce qui n’est pas vendu</h3><p>WORKLY ne doit pas vendre les données personnelles des membres à des annonceurs. Les annonceurs ne doivent pas accéder aux messages privés, aux mots de passe ou aux CV non partagés avec eux dans le cadre d’une candidature.</p><h3>Mes choix et mes droits</h3><p>Tu peux consulter les informations de ton compte, corriger les données inexactes, gérer les autorisations facultatives et demander la suppression de ton compte selon les modalités décrites dans la politique de confidentialité. Les réglages publicitaires ne doivent pas conditionner l’accès aux fonctions essentielles de recherche d’emploi.</p><h3>Publicités et contenus sponsorisés</h3><p>Les offres mises en avant et les contenus sponsorisés doivent être identifiables comme tels. Les statistiques de campagne doivent être présentées de manière agrégée lorsque cela est possible. WORKLY indiquera ici les prestataires publicitaires et les durées de conservation lorsqu’un dispositif publicitaire externe sera effectivement intégré.</p><p class="meta">Version de la rubrique : WORKLY 11.0 · Mise à jour : novembre 2026. Cette information décrit les règles de conception de WORKLY ; elle ne signifie pas qu’un système publicitaire externe est déjà connecté.</p>`;
  const oldParam=vParam;
  vParam=function(){oldParam();
    const view=$('#view');if(!view||view.querySelector('[data-wk-settings-extra]'))return;
    const wrap=document.createElement('section');wrap.dataset.wkSettingsExtra='1';wrap.innerHTML=`<h2 style="margin:24px 0 8px">Informations et préférences</h2>
      <details class="wk-settings-entry"><summary>Données relatives à la publicité</summary><div class="wk-settings-content">${AD_CONTENT}</div></details>
      ${S.user?.role==='candidat'?`<details class="wk-settings-entry"><summary>Parrainage WORKLY</summary><div class="wk-settings-content"><p>Invite des personnes à rejoindre WORKLY avec ton code personnel. À chaque nouveau filleul qui utilise ton code et dont le parrainage est validé, tu reçois <strong>5 crédits</strong> et ton filleul reçoit <strong>3 crédits</strong>.</p><p><strong>Ton code de parrainage :</strong> <span>${esc(S.user.referral_code||'Code en cours de génération')}</span></p>${S.user.referral_code?'<div class="btns"><button data-a="wkCopyReferral">Copier mon code</button></div>':''}<h3>Comment inviter tes proches ?</h3><ol><li>Copie ton code personnel.</li><li>Partage-le avec la personne que tu souhaites inviter.</li><li>Elle saisit ton code lors de son inscription.</li><li>Après validation du parrainage, les crédits sont attribués.</li></ol><p>Tu peux recevoir des récompenses pour chaque nouvelle personne que tu invites et qui valide ton code.</p></div></details>`:''}`;
    view.appendChild(wrap);
  };
  // Retirer les anciennes cartes publicitaires et de parrainage du profil.
  const oldCompte=vCompte;
  vCompte=function(){oldCompte();
    const view=$('#view');if(!view)return;
    view.querySelectorAll('.wk-ad-privacy').forEach(el=>el.remove());

tions essentielles de recherche d’emploi et de recrutement.</p><h3>Transparence des annonces</h3><p>Les contenus sponsorisés et les offres mises en avant doivent être clairement identifiés. Les prestataires publicitaires, les durées de conservation et les éventuels transferts de données seront précisés ici avant l’activation d’un service publicitaire externe.</p><p class="meta">Version de la rubrique : WORKLY 11.0 · Novembre 2026. Cette politique décrit les engagements de conception ; elle ne prétend pas qu’un réseau publicitaire externe est déjà connecté.</p>`;$('#view').appendChild(c)}}catch(e){console.error('WORKLY privacy',e)}})();

<script id="workly-v15-candidate-verification-and-ad-dedupe">
(function(){
 'use strict';
 try{
  const wkEsc=typeof esc==='function'?esc:(v=>String(v??''));
  function wkDedupeAdvertisingSettings(){
   const view=document.querySelector('#view');if(!view)return;
   // Dans Paramètres, une seule rubrique « Données relatives à la publicité » doit rester visible.
   const entries=[...view.querySelectorAll('details.wk-settings-entry')].filter(el=>/données relatives à la publicité/i.test(el.querySelector('summary')?.textContent||''));
   entries.slice(1).forEach(el=>el.remove());
   // Les explications publicitaires sont centralisées dans Paramètres, pas répétées dans le profil.
   if((location.hash||'').slice(1)==='compte')view.querySelectorAll('.wk-ad-privacy').forEach(el=>el.remove());
  }
  const wkPriorParam=vParam;
  vParam=function(){wkPriorParam();wkDedupeAdvertisingSettings()};
  const wkPriorCompte=vCompte;
  function wkStatusMarkup(data,user){
   const status=data?.status||((user?.verified)?'approved':'none');
   if(status==='approved'||user?.verified)return `<div class="wk-verif-status approved">✓ Compte vérifié</div><p class="meta">Ton profil candidat a été vérifié par WORKLY.</p>`;
   if(status==='pending'&&data?.has_document)return `<div class="wk-verif-status pending">◷ Vérification en attente</div><p class="meta">Ton justificatif a bien été transmis. L’équipe WORKLY examine ta demande. Tu recevras une notification après sa décision.</p>`;
   let note='';
   if(status==='rejected')note=`<div class="wk-verif-status rejected">! Vérification refusée</div><div class="wk-verif-note"><strong>Motif communiqué par l’administration :</strong><p>${wkEsc(data?.admin_note||'Aucun motif détaillé n’a été communiqué.')}</p></div><p class="meta">Tu peux envoyer un nouveau justificatif pour demander une nouvelle vérification.</p>`;
   else if(status==='pending')note=`<div class="wk-verif-status pending">◷ Demande commencée</div><p class="meta">Ta demande est enregistrée, mais aucun justificatif n’a encore été transmis. Ajoute ton document pour que l’administration puisse l’examiner.</p>`;
   else note=`<p class="meta">Confirme ton identité pour obtenir le badge « Candidat vérifié ». Ton justificatif sera transmis de manière privée à l’équipe d’administration WORKLY.</p>`;
   return `${note}<div class="wk-verif-form"><div><label for="wkCandidateDocumentType">Type de justificatif</label><select id="wkCandidateDocumentType"><option value="identity_card">Carte nationale d’identité</option><option value="passport">Passeport</option><option value="residence_permit">Titre de séjour</option><option value="other">Autre justificatif</option></select></div><div><label for="wkCandidateDocumentFile">Photo ou fichier du justificatif</label><input id="wkCandidateDocumentFile" type="file" accept="application/pdf,image/jpeg,image/png"><p class="meta">Formats acceptés : PDF, JPG ou PNG. Taille maximale : 8 Mo.</p></div><div><button type="button" id="wkCandidateVerificationSubmit">Envoyer mon justificatif</button></div></div>`;
  }
  async function wkLoadCandidateVerification(card){
   const body=card.querySelector('[data-wk-verification-body]');if(!body)return;
   if(!SB||!S?.uid){body.innerHTML='<p class="meta">Connecte-toi pour consulter ta vérification.</p>';return}
   body.innerHTML='<p class="meta">Chargement du statut de vérification…</p>';
   const result=await SB.rpc('my_candidate_verification');
   if(result.error){body.innerHTML=`<p class="meta">Impossible de charger le statut : ${wkEsc(result.error.message)}</p>`;return}
   const data=result.data||{status:'none'};
   body.innerHTML=wkStatusMarkup(data,S.user);
   const send=body.querySelector('#wkCandidateVerificationSubmit');
   if(!send)return;
   send.addEventListener('click',async()=>{
    const fileInput=body.querySelector('#wkCandidateDocumentFile');
    const typeInput=body.querySelector('#wkCandidateDocumentType');
    const file=fileInput?.files?.[0];
    if(!file){toast('Choisis ton justificatif avant de continuer.');return}
    const allowed=['application/pdf','image/jpeg','image/png'];
    if(!allowed.includes(file.type)){toast('Format non accepté. Utilise un PDF, JPG ou PNG.');return}
    if(file.size>8*1024*1024){toast('Le fichier dépasse la limite de 8 Mo.');return}
    send.disabled=true;send.textContent='Envoi en cours…';
    let path=null;
    try{
     const cleanName=(file.name||'justificatif').normalize('NFKD').replace(/[^a-zA-Z0-9._-]/g,'_').slice(-90);
     path=`${S.uid}/${Date.now()}_${cleanName}`;
     const uploaded=await SB.storage.from('candidate-verifications').upload(path,file,{upsert:false,contentType:file.type});
     if(uploaded.error)throw uploaded.error;
     const payload={nom:S.user?.nom||'',email:S.user?.email||'',pays:S.user?.pays||'',ville:S.user?.ville||'',poste:S.user?.poste||''};
     const submitted=await SB.rpc('submit_candidate_verification',{p_document_type:typeInput.value,p_document_path:path,p_submitted_data:payload});
     if(submitted.error)throw submitted.error;
     toast('Justificatif envoyé. Ta demande est en attente de vérification.');
     if(typeof render==='function')render();
    }catch(err){
     if(path){try{await SB.storage.from('candidate-verifications').remove([path])}catch(_){}}
     toast('Envoi impossible : '+(err?.message||'erreur inconnue'));
     send.disabled=false;send.textContent='Envoyer mon justificatif';
    }
   });
  }
  vCompte=function(){
   wkPriorCompte();
   const view=document.querySelector('#view');
   if(!view||S.user?.role!=='candidat')return;
   // Supprime toute répétition éventuelle de l’ancienne carte publicitaire sur le profil.
   view.querySelectorAll('.wk-ad-privacy').forEach(el=>el.remove());
   if(view.querySelector('.wk-candidate-verification'))return;
   const card=document.createElement('section');card.className='card wk-candidate-verification';
   card.innerHTML='<h2>Vérification de mon compte</h2><p class="meta">Fais vérifier ton identité pour afficher le badge de candidat vérifié sur ton profil.</p><div data-wk-verification-body><p class="meta">Chargement…</p></div>';
   const profile=view.querySelector('.card');
   if(profile&&profile.parentNode)profile.insertAdjacentElement('afterend',card);else view.prepend(card);
   wkLoadCandidateVerification(card).catch(err=>{const b=card.querySelector('[data-wk-verification-body]');if(b)b.innerHTML=`<p class="meta">Erreur de chargement : ${wkEsc(err?.message||err)}</p>`});
  };
  // Réapplique le dédoublonnage après le rendu des pages Paramètres et Compte.
  const wkFinalRender=render;
  render=function(){wkFinalRender();wkDedupeAdvertisingSettings()};
 }catch(e){console.error('WORKLY V15 verification / advertising settings',e)}
})();
</script>

 const $=s=>document.querySelector(s);
 function install(){
