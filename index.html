<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workly & Evolia</title>
<style>
:root{--bg:#F5F7FB;--surface:#fff;--text:#162033;--muted:#5D6B82;--brand:#4F46E5;--brand-t:#fff;--soft:#E9E8FD;--ok:#0E9F6E;--warn:#D97706;--line:#DDE3EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--surface:#172037;--text:#E8ECF6;--muted:#9AA7C0;--brand:#8B85FF;--brand-t:#0E1424;--soft:#26305A;--ok:#34D399;--warn:#FBBF24;--line:#2A3556;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1424;--surface:#172037;--text:#E8ECF6;--muted:#9AA7C0;--brand:#8B85FF;--brand-t:#0E1424;--soft:#26305A;--ok:#34D399;--warn:#FBBF24;--line:#2A3556;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
header{padding:18px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;cursor:pointer}.logo span{color:var(--brand)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--brand)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 14px}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px}
nav a.on{background:var(--brand);color:var(--brand-t)}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 6px}
.sub,.meta{color:var(--muted)}.sub{margin:0 0 16px}.meta{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}textarea{min-height:130px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:var(--brand-t);cursor:pointer}
button.ghost{background:var(--soft);color:var(--brand)}button:disabled{opacity:.55;cursor:default}
button.lnk{background:none;color:var(--muted);padding:4px 8px;font-weight:600;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.v{color:var(--ok);border-color:var(--ok)}.match{font-weight:800;color:var(--ok);font-size:18px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--brand)}
.tip{padding:8px 0;border-top:1px solid var(--line)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.hero{text-align:center;padding:36px 8px}.hero h1{font-size:34px}.hero .btns{justify-content:center}
.price{font-size:30px;font-weight:800}ul.f{padding-left:20px;margin:8px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo" data-a="go" data-id="accueil">Workly <span>×</span> Evolia</div><span class="badge" id="plan"></span></header>
<nav id="nav"></nav><main id="view"></main>
<p class="meta">Workly × Evolia</p>
</div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
let SB=null;
const $=s=>document.querySelector(s),g=i=>$("#"+i).value.trim();
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const load=(k,d)=>{try{const v=localStorage.getItem("wk3_"+k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem("wk3_"+k,JSON.stringify(v))}catch(e){}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),3200)}
const msgErr=e=>/already|exists/i.test(e.message)?"Cet e-mail a déjà un compte : connecte-toi":/password/i.test(e.message)?"Mot de passe trop court (8 caractères minimum)":/Invalid login/i.test(e.message)?"E-mail ou mot de passe incorrect":/not confirmed/i.test(e.message)?"Confirme d’abord ton e-mail":e.message;
const LV=["Débutant","Intermédiaire","Confirmé","Expert"],FIELDS=["Développement web","Marketing digital","Design","Data & IA","Commerce","Finance"],ST=["Envoyée","Vue","Entretien","Refusée","Acceptée"];
const EX={"Développement web":["Page responsive en HTML/CSS pur.","Afficher les données d’une API publique.","Écrire trois tests pour une fonction.","Publier un projet sur GitHub avec un README."],"Marketing digital":["5 publications pour une marque fictive.","Audit SEO d’une page.","Budget pub de 100 € et ciblage.","Analyser une campagne et proposer 3 améliorations."],"Design":["Refaire l’écran d’accueil d’une application.","Créer une charte graphique.","Prototype cliquable de 4 écrans.","Étude de cas d’une page."],"Data & IA":["Nettoyer un CSV incomplet.","3 questions métier en SQL.","Un graphique clair commenté en 5 lignes.","Entraîner un modèle simple et expliquer ses limites."],"Commerce":["E-mail de prospection de 100 mots.","Réponses à 5 objections clients.","Pitch de vente de 60 secondes.","Planifier ton pipeline de la semaine."],"Finance":["Budget prévisionnel dans un tableur.","Interpréter 3 ratios financiers.","Synthèse d’un bilan en une page.","Scénarios optimiste et pessimiste."]};
const QS=[["Présente-toi en une minute.","Parcours, compétences clés, objectif : trois temps."],["Pourquoi ce poste et cette entreprise ?","Cite un élément précis de l’entreprise."],["Parle d’une difficulté surmontée.","Méthode STAR : situation, tâche, action, résultat."],["Ta plus grande force ? Ta faiblesse ?","Donne une faiblesse réelle et ce que tu fais pour la corriger."],["Où te vois-tu dans trois ans ?","Reste réaliste et liée au poste."],["Quelles sont tes prétentions salariales ?","Renseigne-toi sur le marché et propose une fourchette."],["Comment gères-tu un désaccord ?","Écoute, faits, solution commune."],["As-tu des questions pour nous ?","Prépare 2 questions sur l’équipe et les objectifs."]];
const FREE={adapt:2,ana:3,qs:3,ex:2,post:1};
let S={uid:null,user:null,msgs:[],thread:null,draft:"",appIds:{},mine:[],recv:[],cur:null,editId:null,jobs:[],applied:{},saved:[],reported:[],done:load("done",{}),ana:load("ana",0),adapt:load("adapt",0),alerts:load("alerts",false)};
let W=null,ET="cv",TARGET=null;
const prem=()=>!!(S.user&&S.user.premium),role=()=>S.user?S.user.role:null,jobs=()=>S.jobs,sk=p=>(p.skills||"").toLowerCase().split(",").map(s=>s.trim()).filter(Boolean);
function match(p,j){if(!p||(!p.poste&&!sk(p).length))return null;let s=0;const w=(p.poste||"").toLowerCase().split(/\s+/).filter(x=>x.length>3),t=(j.title+" "+j.field).toLowerCase();
 if(w.some(x=>t.includes(x))||p.field===j.field)s+=40;const d=Math.abs(j.level-(p.niveau||0));s+=d===0?30:d===1?15:0;
 const k=sk(p);if(k.length&&j.tags.length)s+=Math.round(30*j.tags.filter(a=>k.some(b=>a.toLowerCase().includes(b)||b.includes(a.toLowerCase()))).length/j.tags.length);return Math.min(s,100)}

async function loadAll(){
 const{data:{session}}=await SB.auth.getSession();S.uid=session?session.user.id:null;S.user=null;S.applied={};S.saved=[];S.mine=[];S.recv=[];S.msgs=[];S.appIds={};
 const today=new Date().toISOString().slice(0,10);const jr=await SB.from("jobs").select("*").eq("active",true).or("deadline.is.null,deadline.gte."+today).order("created_at",{ascending:false});
 S.jobs=(jr.data||[]).map(r=>({...r,tags:r.tags||[],verified:true}));
 if(!S.uid)return;
 const pr=await SB.from("profiles").select("*").eq("id",S.uid).maybeSingle();S.user=pr.data;if(!S.user)return;
 await loadMsgs();const m=session.user.user_metadata||{};
 if(S.user.role==="candidat"&&!S.user.poste&&m.poste){const p={poste:m.poste,niveau:+m.niveau||0,field:m.field||"",pays:m.pays||"",skills:m.skills||""};await SB.from("profiles").update(p).eq("id",S.uid);Object.assign(S.user,p)}
 if(S.user.role==="entreprise"){const m2=await SB.from("jobs").select("*").eq("owner",S.uid).order("created_at",{ascending:false});S.mine=(m2.data||[]).map(r=>({...r,tags:r.tags||[],verified:true}));
  const ids=S.mine.map(j=>j.id);if(ids.length){const r=await SB.from("applications").select("id,status,created_at,job_id,candidate,cand:profiles!candidate(nom,poste,niveau,field,pays,skills,cv,email)").in("job_id",ids).order("created_at",{ascending:false});S.recv=r.data||[]}}
 if(S.user.role==="candidat"){const a=await SB.from("applications").select("id,job_id,status").eq("candidate",S.uid);S.applied=Object.fromEntries((a.data||[]).map(x=>[x.job_id,x.status]));S.appIds=Object.fromEntries((a.data||[]).map(x=>[x.job_id,x.id]));
  const v=await SB.from("saved_jobs").select("job_id").eq("candidate",S.uid);S.saved=(v.data||[]).map(x=>x.job_id)}}

const unread=()=>S.msgs.filter(m=>m.to_id===S.uid&&!m.read_at).length,bd=()=>{const n=unread();return n?" ("+n+")":""};
function drawNav(r){r=r||route();$("#nav").innerHTML=NAV().map(t=>`<a href="#${t[0]}" class="${t[0]===r?"on":""}">${t[1]}</a>`).join("");document.title=(unread()?"("+unread()+") ":"")+"Workly × Evolia"}
async function loadMsgs(){const r=await SB.from("messages").select("*").order("created_at",{ascending:true}).limit(1000);S.msgs=r.data||[]}
function convs(){const out=[];
 if(role()==="candidat"){for(const[jid,id]of Object.entries(S.appIds)){const j=jobs().find(x=>x.id==jid);if(j)out.push({id,title:j.title,who:j.company,other:j.owner})}}
 else for(const r of S.recv){const j=S.mine.find(x=>x.id===r.job_id);out.push({id:r.id,title:j?j.title:"",who:(r.cand&&r.cand.nom)||"Candidat",other:r.candidate})}
 return out.map(c=>{const ms=S.msgs.filter(m=>m.application_id===c.id);return {...c,last:ms[ms.length-1],un:ms.filter(m=>m.to_id===S.uid&&!m.read_at).length}}).sort((a,b)=>(b.last?+new Date(b.last.created_at):0)-(a.last?+new Date(a.last.created_at):0))}
function vMsgs(){const cs=convs(),c=cs.find(x=>x.id===S.thread);
 if(!c){S.thread=null;$("#view").innerHTML=`<h1>Messages</h1>`+(cs.map(c=>`<div class="card"><div class="row"><div><h2>${esc(c.who)} ${c.un?`<span class="chip v">${c.un} nouveau(x)</span>`:""}</h2><span class="meta">${esc(c.title)}</span><p class="meta" style="margin:6px 0 0">${c.last?esc(c.last.text.slice(0,90)):"Aucun message."}</p></div><button data-a="thread" data-id="${c.id}">Ouvrir</button></div></div>`).join("")||'<div class="card meta">Aucune conversation. Elles apparaissent quand un candidat postule à une offre.</div>');return}
 const ms=S.msgs.filter(m=>m.application_id===c.id);
 $("#view").innerHTML=`<p><button class="lnk" data-a="backmsg">← Toutes les conversations</button></p><h1>${esc(c.who)}</h1><p class="sub">${esc(c.title)}</p><div class="card">${ms.map(m=>{const me=m.from_id===S.uid;return `<div style="display:flex;justify-content:${me?"flex-end":"flex-start"};margin:6px 0"><div style="max-width:80%;padding:8px 12px;border-radius:12px;background:${me?"var(--soft)":"var(--bg)"};border:1px solid var(--line);white-space:pre-wrap">${esc(m.text)}<div class="meta" style="font-size:11px">${new Date(m.created_at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</div></div></div>`}).join("")||'<span class="meta">Aucun message pour le moment.</span>'}</div>
 <div class="card"><textarea id="mtxt" maxlength="2000" placeholder="Ton message…">${esc(S.draft)}</textarea><div class="btns"><button data-a="send">Envoyer</button></div></div>`;S.draft="";markRead(c.id)}
async function markRead(id){const l=S.msgs.filter(m=>m.application_id===id&&m.to_id===S.uid&&!m.read_at);if(!l.length)return;const now=new Date().toISOString();await SB.from("messages").update({read_at:now}).eq("application_id",id).eq("to_id",S.uid).is("read_at",null);l.forEach(m=>m.read_at=now);drawNav()}
async function poll(){if(!S.uid||document.hidden)return;const n=unread();await loadMsgs();if(unread()>n)toast("Nouveau message reçu");const t=$("#mtxt");if(route()==="messages"&&(!t||!t.value))vMsgs();else drawNav()}
const EXTRA=["offre","oubli","reset"];
const NAV=()=>!S.user?[["accueil","Accueil"],["offres","Offres"],["tarifs","Tarifs"],["inscription","Créer un compte"],["connexion","Connexion"]]:role()==="candidat"?[["tableau","Tableau de bord"],["offres","Offres"],["candidatures","Candidatures"],["messages","Messages"+bd()],["evolia","Evolia"],["tarifs","Tarifs"],["compte","Compte"]]:[["recruter","Recruter"],["recus","Candidatures reçues"],["messages","Messages"+bd()],["offres","Offres"],["tarifs","Tarifs"],["compte","Compte"]];
function route(){const h=(location.hash||"#accueil").slice(1);if(NAV().some(t=>t[0]===h)||EXTRA.includes(h))return h;return S.user?NAV()[0][0]:"accueil"}
function go(h){if(location.hash==="#"+h)render();else location.hash=h}
function render(){const r=route();$("#plan").textContent=S.user?(prem()?"Premium":"Gratuit"):"";
 drawNav(r);
 ({accueil:vAccueil,inscription:vInsc,connexion:vConn,tableau:vTab,offres:vOffres,candidatures:vCand,evolia:vEvo,recruter:vRec,recus:vRecus,messages:vMsgs,offre:vOffre,oubli:vOubli,reset:vReset,tarifs:vTarifs,compte:vCompte})[r]();window.scrollTo(0,0)}

function vAccueil(){$("#view").innerHTML=`<div class="hero"><h1>Trouve le poste qui te correspond.<br>Évolue avec Evolia.</h1><p class="sub">Des offres vérifiées, un coach carrière qui adapte ton CV à chaque annonce, et un suivi clair de tes candidatures.</p>
<div class="btns"><button data-a="role" data-id="candidat">Je cherche un emploi</button><button class="ghost" data-a="role" data-id="entreprise">Je recrute</button></div></div>
<div class="grid"><div class="card"><h2>Workly</h2><span class="meta">Offres du monde entier, classées par compatibilité avec ton profil.</span></div><div class="card"><h2>Evolia</h2><span class="meta">CV adapté à chaque offre, analyse, exercices et préparation d’entretien.</span></div><div class="card"><h2>Confiance</h2><span class="meta">Entreprises vérifiées et signalement des fausses offres.</span></div></div>`}

function vConn(){$("#view").innerHTML=`<h1>Connexion</h1><div class="card"><div class="grid"><div><label>E-mail</label><input id="mail" type="email"></div><div><label>Mot de passe</label><input id="pw" type="password"></div></div><div class="btns"><button data-a="login">Se connecter</button><button class="ghost" data-a="go" data-id="inscription">Créer un compte</button></div><p><button class="lnk" data-a="go" data-id="oubli">Mot de passe oublié ?</button></p></div>`}

function vInsc(){
 if(!W){$("#view").innerHTML=`<h1>Créer un compte</h1><p class="sub">Tu es…</p><div class="grid"><div class="card"><h2>Candidat</h2><span class="meta">Gratuit, sans carte bancaire. Trois étapes courtes.</span><div class="btns"><button data-a="role" data-id="candidat">Commencer</button></div></div><div class="card"><h2>Entreprise</h2><span class="meta">E-mail professionnel, puis vérification avant la première offre.</span><div class="btns"><button data-a="role" data-id="entreprise">Commencer</button></div></div></div>`;return}
 const d=W.d,cons=`<label style="margin-top:12px"><input type="checkbox" id="cons"> J’accepte que mes données (CV compris) servent à te proposer des offres. Tu peux demander leur suppression à tout moment.</label>`;let h="";
 if(W.role==="candidat"){
  if(W.step===1)h=`<h2>Étape 1/3 : ton compte</h2><div class="grid"><div><label>Nom</label><input id="nom"></div><div><label>E-mail</label><input id="mail" type="email"></div><div><label>Mot de passe (8 caractères min.)</label><input id="pw" type="password"></div></div>${cons}<div class="btns"><button data-a="c1">Continuer</button></div>`;
  if(W.step===2)h=`<h2>Étape 2/3 : ton objectif</h2><div class="grid"><div><label>Poste visé</label><input id="poste" placeholder="ex. Designer UI/UX"></div><div><label>Niveau</label><select id="niv">${LV.map((l,i)=>`<option value="${i}">${l}</option>`).join("")}</select></div><div><label>Domaine</label><select id="fld">${FIELDS.map(f=>`<option>${f}</option>`).join("")}</select></div></div><div class="btns"><button data-a="c2">Continuer</button></div>`;
  if(W.step===3){const n=jobs().filter(j=>match(d,j)>=60).length;h=`<h2>Étape 3/3 : ton CV</h2><p class="ok"><b>${n} offre(s) compatible(s)</b> actuellement.</p><div class="grid"><div><label>Pays</label><input id="pays"></div><div><label>Compétences (virgules)</label><input id="skills" placeholder="Figma, UX"></div></div><label style="margin-top:12px">Colle ton CV ou importe un fichier texte (.txt)</label><textarea id="cv"></textarea><input type="file" id="file" accept=".txt" style="margin-top:8px"><div class="btns"><button data-a="c3">Créer mon compte</button><button class="ghost" data-a="c3" data-id="skip">Passer</button></div>`}
 }else h=`<h2>Compte entreprise</h2><div class="grid"><div><label>Entreprise</label><input id="comp"></div><div><label>Site web</label><input id="site" placeholder="https://www.exemple.com"></div><div><label>E-mail professionnel</label><input id="mail" type="email"></div><div><label>Mot de passe (8 caractères min.)</label><input id="pw" type="password"></div></div>${cons}<div class="btns"><button data-a="e1">Créer le compte</button></div>`;
 $("#view").innerHTML=`<h1>Inscription ${W.role}</h1><div class="card">${h}</div>`;
 const f=$("#file");if(f)f.onchange=()=>{const r=new FileReader();r.onload=()=>{$("#cv").value=r.result};if(f.files[0])r.readAsText(f.files[0])}}

function vTab(){const u=S.user,n=Object.keys(S.applied).length;
 const st=[[u.poste&&u.pays&&sk(u).length,"Compléter ton profil","compte"],[(u.cv||"").length>30,"Ajouter ton CV","compte"],[S.ana>0,"Analyser ton CV avec Evolia","evolia"],[n>=3,"Postuler à 3 offres ("+n+"/3)","offres"]];
 const done=st.filter(s=>s[0]).length,nx=st.find(s=>!s[0]);
 const top=jobs().map(j=>({j,m:match(u,j)})).filter(x=>x.m!==null).sort((a,b)=>b.m-a.m).slice(0,3);
 $("#view").innerHTML=`<h1>Bonjour ${esc(u.nom||"")} 👋</h1><div class="card"><h2>Ta progression : ${done}/4</h2><div class="bar"><i style="width:${done*25}%"></i></div>${st.map(s=>`<div class="tip ${s[0]?"ok":""}">${s[0]?"✔":"○"} ${s[1]}</div>`).join("")}${nx?`<div class="btns"><button data-a="go" data-id="${nx[2]}">${nx[1]}</button></div>`:'<p class="ok">Bravo, tout est fait !</p>'}</div>
 <div class="card"><h2>Meilleures offres pour toi</h2>${top.map(x=>`<div class="tip"><b>${esc(x.j.title)}</b> · ${esc(x.j.company)} <span class="match">${x.m}%</span></div>`).join("")||'<span class="meta">Complète ton profil pour voir des offres compatibles.</span>'}<div class="btns"><button class="ghost" data-a="go" data-id="offres">Voir toutes les offres</button></div></div>`}

function vOffres(){const cs=[...new Set(jobs().map(j=>j.country))].sort();
 $("#view").innerHTML=`<h1>Offres</h1><div class="card"><div class="grid"><div><label>Poste ou mot-clé</label><input id="fq"></div><div><label>Pays</label><select id="fc"><option value="">Tous</option>${cs.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div><label>Niveau</label><select id="fl"><option value="">Tous</option>${LV.map((l,i)=>`<option value="${i}">${l}</option>`).join("")}</select></div><div><label>Domaine</label><select id="ff"><option value="">Tous</option>${FIELDS.map(f=>`<option>${f}</option>`).join("")}</select></div></div>
 <label style="margin-top:12px"><input type="checkbox" id="fr"> Télétravail uniquement</label></div><div id="list"></div>`;
 ["fq","fc","fl","ff","fr"].forEach(i=>$("#"+i).addEventListener("input",list));list()}
const CT=["CDI","CDD","Stage","Freelance","Temps partiel","Autre"];

function analyse(t,p){const w=t.trim().split(/\s+/).filter(Boolean).length;let s=0;const o=[];const c=(ok,pt,a,b)=>{if(ok)s+=pt;o.push([ok,ok?a:b])};
 c(w>=150&&w<=700,20,"Longueur adaptée ("+w+" mots).","Vise 150 à 700 mots (tu en as "+w+").");c(/[\w.+-]+@[\w-]+\.[\w.]+/.test(t),10,"E-mail présent.","Ajoute un e-mail professionnel.");
 c(/exp[ée]rience/i.test(t),10,"Section Expérience.","Ajoute une section Expérience.");c(/formation|[ée]tudes|dipl[ôo]me/i.test(t),10,"Section Formation.","Ajoute une section Formation.");c(/comp[ée]tences/i.test(t),10,"Section Compétences.","Ajoute une section Compétences.");
 c((t.match(/\d+\s?(%|k\b|€|\$|clients|projets|ans|mois)/gi)||[]).length>=2,20,"Résultats chiffrés présents.","Ajoute des chiffres : « +30 % de ventes ».");
 c((t.match(/\b(géré|développé|créé|dirigé|amélioré|augmenté|réduit|lancé|conçu|optimisé|organisé)\b/gi)||[]).length>=3,10,"Verbes d’action bien utilisés.","Commence tes phrases par : développé, lancé, optimisé…");
 c(!p.poste||t.toLowerCase().includes(p.poste.toLowerCase().split(" ")[0]),10,"Ton poste visé apparaît.","Mentionne clairement le poste visé.");return{s,o}}

async save(id){if(role()!=="candidat"){toast("Crée un compte candidat pour enregistrer");go("inscription");return}id=+id;
 if(S.saved.includes(id)){await SB.from("saved_jobs").delete().eq("candidate",S.uid).eq("job_id",id);S.saved=S.saved.filter(x=>x!==id)}
 else{await SB.from("saved_jobs").insert({candidate:S.uid,job_id:id});S.saved.push(id)}refresh()},
async report(id){if(!S.uid){toast("Connecte-toi pour signaler une offre");go("connexion");return}await SB.from("reports").insert({job_id:+id,reporter:S.uid});S.reported.push(+id);toast("Merci, offre signalée pour vérification");refresh()},
adaptjob(id){if(role()!=="candidat"){toast("Crée un compte candidat pour utiliser Evolia");go("inscription");return}TARGET=+id;ET="adapt";go("evolia")},
etab(id){ET=id;vEvo()},
ana(){const t=$("#cv").value;if(t.trim().length<30){toast("Colle d’abord ton CV");return}if(!prem()&&S.ana>=FREE.ana){toast("Limite gratuite atteinte");go("tarifs");return}S.ana++;save("ana",S.ana);const a=analyse(t,S.user);
 $("#res").innerHTML=`<h2 style="margin-top:14px">Score : ${a.s}/100</h2><div class="bar"><i style="width:${a.s}%"></i></div>`+a.o.map(x=>`<div class="tip ${x[0]?"ok":"warn"}">${x[0]?"✔":"→"} ${esc(x[1])}</div>`).join("")},
gen(){if(!prem()&&S.adapt>=FREE.adapt){toast("Limite gratuite atteinte");go("tarifs");return}S.adapt++;save("adapt",S.adapt);TARGET=+$("#tj").value;$("#res").innerHTML=`<textarea style="min-height:320px;margin-top:12px">${esc(gen(jobs().find(j=>j.id===TARGET)))}</textarea>`},
tip(id){$("#t"+id).textContent="Conseil : "+QS[id][1]},
ex(id){const f=S.user.field||FIELDS[0],d=S.done[f]||(S.done[f]=[]),i=+id,k=d.indexOf(i);k>=0?d.splice(k,1):d.push(i);save("done",S.done);vEvo()},
async pub(){if(!g("et")||!g("ep")){toast("Renseigne le poste et le pays");return}
 const row={title:g("et"),country:g("ep"),city:g("ev")||"—",level:+$("#el").value,field:$("#ed").value,contract:$("#ec").value,salary:g("es"),deadline:$("#edl").value||null,description:$("#edesc").value.trim(),remote:$("#er").checked,tags:g("eg").split(",").map(x=>x.trim()).filter(Boolean)};
 let r;if(S.editId)r=await SB.from("jobs").update(row).eq("id",S.editId);else r=await SB.from("jobs").insert({...row,owner:S.uid,company:S.user.company});
 if(r.error){if(/Limite gratuite/.test(r.error.message)){toast("Limite gratuite atteinte");go("tarifs")}else toast("Impossible d’enregistrer : "+r.error.message);return}
 const was=S.editId;S.editId=null;await loadAll();toast(was?"Offre modifiée":"Offre publiée");render()},
plan(){toast("Le paiement Premium sera connecté à l’étape 7")},
async psave(){const p={poste:g("poste"),niveau:+$("#niv").value,pays:g("pays"),skills:g("skills"),cv:$("#cv").value};const{error}=await SB.from("profiles").update(p).eq("id",S.uid);if(error){toast("Erreur : "+error.message);return}Object.assign(S.user,p);toast("Profil enregistré")}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b)});
document.addEventListener("change",async e=>{const s=e.target.dataset.rs;if(s){const{error}=await SB.from("applications").update({status:e.target.value}).eq("id",+s);if(error)toast("Erreur : "+error.message);else{const r=S.recv.find(x=>x.id==s);if(r)r.status=e.target.value;toast("Statut mis à jour");if(e.target.value==="Entretien"){S.thread=+s;S.draft="Bonjour, nous souhaitons vous rencontrer pour un entretien.\nDate et heure : \nLieu ou lien de l’appel : \nMerci de confirmer votre disponibilité.";go("messages")}}}});
window.addEventListener("hashchange",render);
