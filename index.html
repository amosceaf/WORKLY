<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workly & Evolia</title>
<style>
:root{--bg:#F5F7FB;--surface:#fff;--text:#162033;--muted:#5D6B82;--brand:#4F46E5;--brand-t:#fff;--soft:#E9E8FD;--ok:#0E9F6E;--warn:#D97706;--line:#DDE3EE;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--surface:#172037;--text:#E8ECF6;--muted:#9AA7C0;--brand:#8B85FF;--brand-t:#0E1424;--soft:#26305A;--ok:#34D399;--warn:#FBBF24;--line:#2A3556;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1424;--surface:#172037;--text:#E8ECF6;--muted:#9AA7C0;--brand:#8B85FF;--brand-t:#0E1424;--soft:#26305A;--ok:#34D399;--warn:#FBBF24;--line:#2A3556;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
header{padding:18px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:24px;font-weight:800;letter-spacing:-.5px;cursor:pointer}.logo span{color:var(--brand)}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--brand)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 14px}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:8px 14px;border-radius:99px;font-weight:600;font-size:15px}
nav a.on{background:var(--brand);color:var(--brand-t)}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 6px}
.sub,.meta{color:var(--muted)}.sub{margin:0 0 16px}.meta{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}textarea{min-height:130px;resize:vertical}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:var(--brand-t);cursor:pointer}
button.ghost{background:var(--soft);color:var(--brand)}button:disabled{opacity:.55;cursor:default}
button.lnk{background:none;color:var(--muted);padding:4px 8px;font-weight:600;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.v{color:var(--ok);border-color:var(--ok)}.match{font-weight:800;color:var(--ok);font-size:18px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--brand)}
.tip{padding:8px 0;border-top:1px solid var(--line)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.hero{text-align:center;padding:36px 8px}.hero h1{font-size:34px}.hero .btns{justify-content:center}
.price{font-size:30px;font-weight:800}ul.f{padding-left:20px;margin:8px 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}#toast.show{opacity:1}

:root[data-accent="ocean"]{--brand:#0E7490;--soft:#D9F0F5}:root[data-accent="forest"]{--brand:#15803D;--soft:#DCF5E4}:root[data-accent="sun"]{--brand:#C2410C;--soft:#FDE8D9}:root[data-accent="rose"]{--brand:#BE185D;--soft:#FBE0EC}
:root[data-accent="ocean"][data-theme="dark"]{--brand:#4FC3DC;--soft:#17394A}:root[data-accent="forest"][data-theme="dark"]{--brand:#4ADE80;--soft:#163A25}:root[data-accent="sun"][data-theme="dark"]{--brand:#FB923C;--soft:#4A2A17}:root[data-accent="rose"][data-theme="dark"]{--brand:#F472B6;--soft:#4A1E34}
@media (prefers-color-scheme:dark){:root[data-accent="ocean"]:not([data-theme="light"]){--brand:#4FC3DC;--soft:#17394A}:root[data-accent="forest"]:not([data-theme="light"]){--brand:#4ADE80;--soft:#163A25}:root[data-accent="sun"]:not([data-theme="light"]){--brand:#FB923C;--soft:#4A2A17}:root[data-accent="rose"]:not([data-theme="light"]){--brand:#F472B6;--soft:#4A1E34}}
.brand{text-align:center;padding:8px 0 14px}.bfl{display:inline-block;animation:flt 5s ease-in-out infinite}.blogo{width:128px;height:128px;border-radius:28px;cursor:pointer;display:block;box-shadow:0 8px 30px rgba(59,130,246,.35);transition:transform .4s,box-shadow .4s}.blogo:hover{transform:scale(1.07) rotate(-2deg);box-shadow:0 10px 36px rgba(251,146,60,.45)}.blogo.pop{animation:pop .7s}
.wlg{font-weight:800;letter-spacing:.18em;font-size:13px;color:var(--muted);margin-top:8px}.bmsg{min-height:2.8em;margin:6px auto 0;max-width:520px;font-style:italic;transition:opacity .6s}.bmsg.out{opacity:0}
.robot{color:var(--text);animation:flt 4s ease-in-out infinite}.robot .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(6deg)}100%{transform:scale(1)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.bfl,.blogo.pop,.robot,.robot .eye{animation:none}.bmsg{transition:none}}
</style>
</head>

 $("#edesc").value=`À propos du poste\n${S.user.company} recrute un(e) ${t} en ${ct}${$("#er").checked?", avec possibilité de télétravail":""}.\n\nMissions\n${(tags.length?tags.slice(0,5).map(x=>"- Mettre en œuvre "+x+" au quotidien"):["- Missions à préciser"]).join("\n")}\n- Collaborer avec l’équipe et rendre compte de l’avancement\n\nProfil recherché\n- Niveau : ${lv}\n${tags.length?"- Compétences : "+tags.join(", ")+"\n":""}- Sens de l’organisation et goût du travail en équipe\n\nNous offrons\n- Un cadre de travail clair et un accompagnement à la prise de poste\n- [Salaire, avantages, perspectives : à compléter]\n\nPour candidater : postule directement sur Workly avec ton profil et ton CV.`;toast("Description proposée : relis-la et complète-la")},
anon(id,el){ANON=el.checked;vRecus()},
async talent(id){if(!BIZ()){toast("Le vivier est inclus dans l’offre Business");go("tarifs");return}const r=S.recv.find(x=>x.id==id);if(!r)return;const c=r.cand||{};if(!c.allow_pool){toast("Ce candidat n’a pas autorisé le vivier");return}
 const{data,error}=await SB.from("talent_pool").insert({owner:S.uid,cand_id:r.candidate,nom:c.nom||"",email:c.email||"",poste:c.poste||"",niveau:c.niveau||0,field:c.field||"",pays:c.pays||"",skills:c.skills||"",cv:c.cv||""}).select().single();
 if(error){toast(error.code==="23505"?"Déjà dans le vivier":error.message);return}S.pool.unshift(data);toast("Profil ajouté au vivier");vRecus()},
async tnote(id){const p=S.pool.find(x=>x.id==id);if(!p)return;const t=prompt("Note sur ce profil :",p.note||"");if(t===null)return;const{error}=await SB.from("talent_pool").update({note:t.slice(0,500)}).eq("id",p.id);if(error){toast(error.message);return}p.note=t.slice(0,500);vTalents()},
async tdel(id){if(!confirm("Retirer ce profil du vivier ?"))return;const{error}=await SB.from("talent_pool").delete().eq("id",+id);if(error){toast(error.message);return}S.pool=S.pool.filter(x=>x.id!=id);vTalents()},
pkt(id){const s=$("#pks-"+id),j=$("#pkj-"+id),open=s.style.display!=="none"||j.innerHTML!=="";if(open){s.style.display="none";j.innerHTML=""}else s.style.display="flex"},
pks(v){const[id,i]=v.split("|"),f=FIELDS[+i],[,sid]=PK[id];$("#"+sid).value=f;$("#pkl-"+id).textContent=f;$("#pks-"+id).style.display="none";$("#pkj-"+id).innerHTML=`<button type="button" class="lnk" data-a="pkb" data-id="${id}">← Autres secteurs</button>`+SECT[f].map((m,k)=>`<button type="button" class="chip" style="cursor:pointer" data-a="pkj" data-id="${id}|${i}|${k}">${esc(m)}</button>`).join("")},
pkb(id){$("#pkj-"+id).innerHTML="";$("#pks-"+id).style.display="flex"},
pkj(v){const[id,i,k]=v.split("|"),[jid]=PK[id];$("#"+jid).value=SECT[FIELDS[+i]][+k];$("#pks-"+id).style.display="none";$("#pkj-"+id).innerHTML="";toast("Métier choisi : "+$("#"+jid).value)},
async notifopen(id){const n=S.notifs.find(x=>x.id==id);if(!n)return;if(!n.read_at){n.read_at=new Date().toISOString();await SB.from("notifications").update({read_at:n.read_at}).eq("id",n.id)}
 const l=n.link||"notifications";if(l.startsWith("offre:")){S.cur=+l.slice(6);go("offre")}else go(l)},
async notifall(){const now=new Date().toISOString();await SB.from("notifications").update({read_at:now}).eq("user_id",S.uid).is("read_at",null);S.notifs.forEach(n=>n.read_at=n.read_at||now);vNotifs();drawNav()},
async notifjobs(id,el){const{error}=await SB.from("profiles").update({notify_jobs:el.checked}).eq("id",S.uid);if(error){toast(error.message);return}S.user.notify_jobs=el.checked;toast("Préférence enregistrée")},
ann(id){ANN=id==="1";vTarifs()},
choose(id){const cur=S.user?(S.user.plan||"gratuit"):"";
 if(!S.user){toast("Crée d’abord ton compte");go("inscription");return}
 if(id===cur){toast("C’est ton offre actuelle");return}
 if(id==="gratuit"){toast("Pour revenir à l’offre gratuite, écris-nous à "+B.mail);return}
 toast("Le paiement sera activé prochainement. Écris-nous pour réserver cette offre.");location.href="mailto:"+B.mail+"?subject="+encodeURIComponent("Souscription offre "+id)},
setst(v){const[id,s]=v.split("|");chgStatus(+id,s)},
dup(id){S.dupe={...S.mine.find(x=>x.id==id),id:undefined};S.editId=null;vRec();window.scrollTo(0,0);toast("Offre copiée : modifie-la puis publie")},
thread(id){S.thread=+id;go("messages")},backmsg(){S.thread=null;render()},
async send(){const t=$("#mtxt").value.trim();if(!t){toast("Écris un message");return}const c=convs().find(x=>x.id===S.thread);if(!c)return;
 const{data,error}=await SB.from("messages").insert({application_id:c.id,from_id:S.uid,to_id:c.other,text:t}).select().single();
 if(error){toast(/row-level|policy/i.test(error.message)?"Envoi impossible : ton entreprise doit être vérifiée":error.message);return}
 S.msgs.push(data);vMsgs()},
async notif(id,el){const{error}=await SB.from("profiles").update({notify_email:el.checked}).eq("id",S.uid);if(error){toast(error.message);return}S.user.notify_email=el.checked;toast("Préférence enregistrée")},
detail(id){S.cur=+id;go("offre")},edit(id){S.editId=+id;render()},cancel(){S.editId=null;S.dupe=null;render()},
async toggle(id){const j=S.mine.find(x=>x.id==id);const{error}=await SB.from("jobs").update({active:!j.active}).eq("id",+id);if(error){toast(/Limite/.test(error.message)?"Limite gratuite : une seule offre active":error.message);return}await loadAll();render()},
async del(id){if(!confirm("Supprimer cette offre et ses candidatures ?"))return;const{error}=await SB.from("jobs").delete().eq("id",+id);if(error){toast(error.message);return}await loadAll();toast("Offre supprimée");render()},
async sendreset(){const m=g("mail");if(!/\S+@\S+\.\S+/.test(m)){toast("Renseigne un e-mail valide");return}const{error}=await SB.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});if(error){toast(msgErr(error));return}toast("Si un compte existe, un lien vient d’être envoyé")},
async setpw(){if($("#pw").value.length<8){toast("8 caractères minimum");return}const{error}=await SB.auth.updateUser({password:$("#pw").value});if(error){toast(msgErr(error));return}await loadAll();toast("Mot de passe modifié");go(S.user?("tableau"):"connexion")},
role:id=>{W={role:id,step:1,d:{}};go("inscription")},
c1(){const m=g("mail");if(!/\S+@\S+\.\S+/.test(m)||!g("nom")){toast("Renseigne ton nom et un e-mail valide");return}if($("#pw").value.length<8){toast("Mot de passe : 8 caractères minimum");return}if(!$("#cons").checked){toast("Accepte le consentement pour continuer");return}Object.assign(W.d,{nom:g("nom"),email:m,pw:$("#pw").value});W.step=2;render()},
c2(){if(!g("poste")){toast("Indique le poste visé");return}Object.assign(W.d,{poste:g("poste"),niveau:+$("#niv").value,field:$("#ssec").value||"Autre"});W.step=3;render()},
async c3(id){const d=W.d;if(id!=="skip")Object.assign(d,{pays:g("pays"),ville:g("ville"),skills:g("skills"),cv:$("#cv").value});
 const{data,error}=await SB.auth.signUp({email:d.email,password:d.pw,options:{emailRedirectTo:location.origin+location.pathname,data:{role:"candidat",nom:d.nom,poste:d.poste,niveau:d.niveau,field:d.field,pays:d.pays||"",ville:d.ville||"",skills:d.skills||""}}});
 if(error){toast(msgErr(error));return}
 W=null;if(!data.session){toast("Compte créé : confirme ton e-mail puis connecte-toi");go("connexion");return}
 await loadAll();if(d.cv&&S.user){await SB.from("profiles").update({cv:d.cv}).eq("id",S.uid);S.user.cv=d.cv}toast("Compte créé");go("tableau")},

 const site=g("site").toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").split("/")[0];
 const{data,error}=await SB.auth.signUp({email:m,password:$("#pw").value,options:{emailRedirectTo:location.origin+location.pathname,data:{role:"entreprise",nom:c,company:c,site}}});
 if(error){toast(msgErr(error));return}
 W=null;if(!data.session){toast("Compte créé : confirme ton e-mail puis connecte-toi");go("connexion");return}
 await loadAll();toast("Compte créé");go("tableau")},
async login(){const{error}=await SB.auth.signInWithPassword({email:g("mail"),password:$("#pw").value});if(error){toast(msgErr(error));return}

async apply(id){if(role()!=="candidat"){toast("Crée un compte candidat pour postuler");go("inscription");return}
 const{error}=await SB.from("applications").insert({candidate:S.uid,job_id:+id});if(error&&error.code!=="23505"){toast("Erreur : "+error.message);return}
 S.applied[id]="Reçue";toast("Candidature envoyée");refresh()},

 if(S.saved.includes(id)){await SB.from("saved_jobs").delete().eq("candidate",S.uid).eq("job_id",id);S.saved=S.saved.filter(x=>x!==id)}
 else{await SB.from("saved_jobs").insert({candidate:S.uid,job_id:id});S.saved.push(id)}refresh()},

etab(id){ET=id;vEvo()},
async ana(){const t=$("#cv").value;if(t.trim().length<30){toast("Colle d’abord ton CV");return}const ai=await evoAI("analyse",{cv:t,poste:S.user.poste});if(ai.ok){$("#res").innerHTML=aiBox(ai.text);return}if(ai.err==="consent")return;if(ai.err==="quota"||ai.err==="rate"){aiLimit(ai);return}if(!await quota("analyse"))return;const a=analyse(t,S.user);
 $("#res").innerHTML=`<h2 style="margin-top:14px">Score : ${a.s}/100</h2><div class="bar"><i style="width:${a.s}%"></i></div>`+a.o.map(x=>`<div class="tip ${x[0]?"ok":"warn"}">${x[0]?"✔":"→"} ${esc(x[1])}</div>`).join("")},
