function analyse(t,p){const w=t.trim().split(/\s+/).filter(Boolean).length;let s=0;const o=[];const c=(ok,pt,a,b)=>{if(ok)s+=pt;o.push([ok,ok?a:b])};
 c(w>=150&&w<=700,20,"Longueur adaptée ("+w+" mots).","Vise 150 à 700 mots (tu en as "+w+").");c(/[\w.+-]+@[\w-]+\.[\w.]+/.test(t),10,"E-mail présent.","Ajoute un e-mail professionnel.");
 c(/exp[ée]rience/i.test(t),10,"Section Expérience.","Ajoute une section Expérience.");c(/formation|[ée]tudes|dipl[ôo]me/i.test(t),10,"Section Formation.","Ajoute une section Formation.");c(/comp[ée]tences/i.test(t),10,"Section Compétences.","Ajoute une section Compétences.");
 c((t.match(/\d+\s?(%|k\b|€|\$|clients|projets|ans|mois)/gi)||[]).length>=2,20,"Résultats chiffrés présents.","Ajoute des chiffres : « +30 % de ventes ».");
 c((t.match(/\b(géré|développé|créé|dirigé|amélioré|augmenté|réduit|lancé|conçu|optimisé|organisé)\b/gi)||[]).length>=3,10,"Verbes d’action bien utilisés.","Commence tes phrases par : développé, lancé, optimisé…");
 c(!p.poste||t.toLowerCase().includes(p.poste.toLowerCase().split(" ")[0]),10,"Ton poste visé apparaît.","Mentionne clairement le poste visé.");return{s,o}}
